<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
// ============================================================
//  DUMB WAYS TO EXMATRIKULATION – WarioWare-Klon (Prototyp)
//  Neues Minigame: Klasse von MicroGame ableiten, setup() + step(dt)
//  schreiben, in GAME_KEYS und in config.scene eintragen. Fertig.
// ============================================================
const W = 800, H = 450;
const COL = {
  ink: 0x10231A, exit: 0x1E8A4C, paper: 0xF5F7F2, hazard: 0xFFC61A,
  alarm: 0xE2382B, good: 0x3FD07A, slate: 0x24323A, wall: 0xD7DDD3,
  floor: 0xC2B08F, chair: 0x2E5E8C, skin: 0xE8B88E
};
const STUDENT_COLORS = [0xE2382B, 0x7A4FB5, 0x2C9C8F, 0xD9822B, 0x4466CC];
const FONT = '"Press Start 2P", "Courier New", monospace';
const BODY = '"VT323", "Courier New", monospace';
const INK = 0x07071A, INK_S = '#07071A';
const NEON = { pink: '#FF2E88', cyan: '#00E5FF', yellow: '#FFE600', green: '#39FF14', purple: '#B24DFF', orange: '#FF8A00' };
const NEON_HEX = [0xFF2E88, 0x00E5FF, 0xFFE600, 0x39FF14, 0xB24DFF, 0xFF8A00];
const GAME_KEYS = ['FensterZu', 'WlanFangen', 'Sitzplatz', 'Fluchttreppe', 'Speichern', 'KloFinden'];

// ---------- Spielstand ----------
const State = { lives: 4, score: 0, round: 0, speed: 1, result: null, bag: [], last: null, best: 0 };
try { State.best = parseInt(localStorage.getItem('dhbw-survival-best'), 10) || 0; } catch (e) {}

function resetRun() {
  Object.assign(State, { lives: 4, score: 0, round: 0, speed: 1, result: null, bag: [], last: null });
}
function nextGameKey() {
  if (!State.bag.length) {
    State.bag = Phaser.Utils.Array.Shuffle(GAME_KEYS.slice());
    if (State.bag[0] === State.last) State.bag.push(State.bag.shift());
  }
  State.last = State.bag.shift();
  return State.last;
}

// ---------- Sound (WebAudio, keine Assets nötig) ----------
const Sfx = {
  ctx: null,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur = 0.1, type = 'square', vol = 0.06, slide = 0) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, gap = 80, dur = 0.11) { notes.forEach((f, i) => setTimeout(() => this.tone(f, dur), i * gap)); },
  win() { this.seq([523, 659, 784, 1046]); },
  lose() { this.tone(320, 0.45, 'sawtooth', 0.07, -240); },
  tick() { this.tone(980, 0.04, 'square', 0.035); },
  blip() { this.tone(660, 0.05, 'square', 0.04); },
  coin() { this.tone(988, 0.08, 'square', 0.06); setTimeout(() => this.tone(1319, 0.35, 'square', 0.06), 80); },
  faster() { this.seq([392, 523, 659, 784, 1046, 1318], 60, 0.08); },
  over() { this.seq([392, 330, 262, 196], 180, 0.25); },
  // Pups: wabbelnder Grundton + gefiltertes Rauschen, Lautstärke flattert
  fart(dur = 1.1) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, N = 64;
    const pitch = new Float32Array(N), amp = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const k = i / (N - 1);
      pitch[i] = (95 - 40 * k) * (0.8 + Math.random() * 0.4);                    // sinkt, eiert
      const env = Math.min(1, k * 12) * (1 - Math.pow(k, 3));                    // schnell rein, langsam raus
      amp[i] = env * (i % 2 ? 0.35 + Math.random() * 0.3 : 1) * 0.22;             // Flattern der Backen
    }
    amp[N - 1] = 0;

    const o = c.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueCurveAtTime(pitch, t, dur);

    const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource(); noise.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 180; bp.Q.value = 0.8;
    const ng = c.createGain(); ng.gain.value = 0.6;

    const shaper = c.createWaveShaper(), curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 4); }
    shaper.curve = curve;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(250, t + dur);
    const g = c.createGain(); g.gain.setValueCurveAtTime(amp, t, dur);

    o.connect(shaper); noise.connect(bp); bp.connect(ng); ng.connect(shaper);
    shaper.connect(lp); lp.connect(g); g.connect(c.destination);
    o.start(t); noise.start(t); o.stop(t + dur + 0.05); noise.stop(t + dur + 0.05);
  }
};

// ---------- Musik: eigener Gute-Laune-Loop, Tempo hängt an State.speed ----------
const Music = {
  on: false, muted: false, bpm: 128, step: 0, next: 0, timer: null, out: null, noise: null,
  // 4 Takte à 16 Sechzehntel, MIDI-Noten, 0 = Pause
  MEL: [
    76, 0, 79, 0, 84, 0, 79, 0, 81, 79, 76, 0, 74, 0, 76, 0,
    72, 0, 76, 0, 81, 0, 76, 0, 79, 0, 76, 0, 74, 72, 0, 0,
    77, 0, 81, 0, 84, 0, 81, 0, 79, 0, 77, 0, 76, 0, 74, 0,
    79, 0, 0, 79, 81, 0, 79, 0, 77, 0, 76, 0, 74, 0, 71, 0
  ],
  CH: [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]],   // C – Am – F – G
  mtof(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  start(speed = 1) {
    const c = Sfx.ctx; if (!c) return;
    if (!this.out) {
      this.out = c.createGain(); this.out.connect(c.destination);
      const len = c.sampleRate * 0.2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    this.out.gain.value = this.muted ? 0 : 0.5;
    this.setSpeed(speed);
    if (this.on) return;
    this.on = true; this.step = 0; this.next = c.currentTime + 0.05;
    this.timer = setInterval(() => this.pump(), 25);
  },
  stop() { this.on = false; clearInterval(this.timer); },
  setSpeed(s) { this.bpm = 128 * s; },
  toggleMute() { this.muted = !this.muted; if (this.out) this.out.gain.value = this.muted ? 0 : 0.5; },
  pump() {
    const c = Sfx.ctx;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime;   // Tab war im Hintergrund
    while (this.next < c.currentTime + 0.12) {
      this.play(this.step % 64, this.next);
      this.next += 60 / this.bpm / 4;
      this.step++;
    }
  },
  play(i, t) {
    const s = i & 15, ch = this.CH[i >> 4], beat = 60 / this.bpm;
    if (this.MEL[i]) this.voice(t, this.mtof(this.MEL[i]), beat * 0.45, 'square', 0.07);
    if (s % 4 === 0) this.voice(t, this.mtof(ch[0] - 12 + (s % 8 ? 12 : 0)), beat * 0.4, 'triangle', 0.22);   // Bass
    if (s % 2 === 1) this.voice(t, this.mtof(ch[(i >> 1) % 3] + 24), beat * 0.12, 'square', 0.025);       // Chiptune-Arpeggio
    if (s % 8 === 0) this.kick(t);
    if (s % 8 === 4) this.hit(t, 0.12, 1500, 0.22);   // Snare
    if (s % 2 === 1) this.hit(t, 0.03, 7000, 0.06);   // Hi-Hat
  },
  voice(t, f, d, type, v) {
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + d + 0.02);
  },
  kick(t) {
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + 0.17);
  },
  hit(t, d, hp, v) {
    const c = Sfx.ctx, n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = this.noise; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    n.connect(f); f.connect(g); g.connect(this.out);
    n.start(t); n.stop(t + d + 0.01);
  }
};
window.addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) Music.toggleMute(); });

// ---------- Helfer ----------
// Pixel-Schrift ist breit: Größen werden hier zentral angepasst
function txt(scene, x, y, s, size, color = '#F5F7F2', extra = {}) {
  return scene.add.text(x, y, s, Object.assign({ fontFamily: FONT, fontSize: Math.round(size * 0.72) + 'px', color, align: 'center' }, extra)).setOrigin(0.5);
}
// Leuchtschrift: schwarzer Rand + Neon-Glow, passt sich der Breite an
function big(scene, x, y, s, size, color = '#FFFFFF') {
  const t = txt(scene, x, y, s, size, color, { stroke: INK_S, strokeThickness: Math.max(5, size / 8) });
  t.setShadow(0, 0, color, 14, true, true);
  if (t.width > W - 40) t.setScale((W - 40) / t.width);
  return t;
}
function body(scene, x, y, s, size, color = '#F5F7F2', extra = {}) {
  return scene.add.text(x, y, s, Object.assign({ fontFamily: BODY, color, align: 'center' }, extra, { fontSize: Math.round(size * 1.35) + 'px', fontStyle: 'normal' })).setOrigin(0.5);
}
// Bohne mit Gesicht; (x, y) = Fußpunkt Mitte. mood: happy | worried | dead
function drawBean(g, x, y, s, color, mood = 'happy') {
  const w = 34 * s, h = 58 * s, ex = 7 * s, ey = y - h * 0.7;
  g.fillStyle(color).fillRoundedRect(x - w / 2, y - h, w, h, w / 2 - 0.5);
  if (mood === 'dead') {
    const r = 3.5 * s;
    g.lineStyle(2.5 * s, INK);
    for (const dx of [-ex, ex]) { g.lineBetween(x + dx - r, ey - r, x + dx + r, ey + r); g.lineBetween(x + dx - r, ey + r, x + dx + r, ey - r); }
    g.lineBetween(x - 5 * s, y - h * 0.45, x + 5 * s, y - h * 0.45);
    return g;
  }
  g.fillStyle(0xFFFFFF).fillCircle(x - ex, ey, 6 * s).fillCircle(x + ex, ey, 6 * s);
  g.fillStyle(INK).fillCircle(x - ex + s, ey + s, 3 * s).fillCircle(x + ex + s, ey + s, 3 * s);
  if (mood === 'happy') { g.lineStyle(2.5 * s, INK); g.beginPath(); g.arc(x, y - h * 0.5, 6 * s, 0.2, Math.PI - 0.2); g.strokePath(); }
  else g.fillStyle(INK).fillEllipse(x, y - h * 0.42, 6 * s, 8 * s);
  return g;
}
// Hilfsfunktion: Callback pro Frame, wird beim Szenenwechsel abgemeldet
function onFrame(scene, fn) {
  scene.events.on('update', fn);
  scene.events.once('shutdown', () => scene.events.off('update', fn));
}
// Scrollendes Sternenfeld
function stars(scene, n = 70) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const v = 15 + Math.random() * 70;
    list.push({ v, r: scene.add.rectangle(Math.random() * W, Math.random() * H, v > 60 ? 3 : 2, v > 60 ? 3 : 2, 0xFFFFFF, 0.25 + v / 120) });
  }
  onFrame(scene, (t, dt) => {
    for (const s of list) { s.r.y += s.v * dt / 1000; if (s.r.y > H) { s.r.y = 0; s.r.x = Math.random() * W; } }
  });
}
// Neon-Rahmen mit Glow
function frame(scene, color = 0xFF2E88) {
  const g = scene.add.graphics().setDepth(80);
  [[10, 0.15], [6, 0.3], [3, 1]].forEach(([w, a]) => g.lineStyle(w, color, a).strokeRect(8, 8, W - 16, H - 16));
  return g;
}
// Synthwave-Boden: Fluchtlinien + laufende Querlinien
function neonGrid(scene, horizon = 300, color = 0xB24DFF) {
  const g = scene.add.graphics();
  let off = 0;
  onFrame(scene, (t, dt) => {
    off = (off + dt / 1000 * 0.8) % 1;
    g.clear();
    g.fillStyle(0x12052A).fillRect(0, horizon, W, H - horizon);
    g.lineStyle(2, color, 0.8);
    for (let i = -10; i <= 10; i++) g.lineBetween(W / 2 + i * 30, horizon, W / 2 + i * 150, H);
    for (let k = 0; k < 8; k++) {
      const f = Math.pow((k + off) / 8, 2), y = horizon + f * (H - horizon);
      g.lineBetween(0, y, W, y);
    }
    g.lineStyle(3, 0xFF2E88).lineBetween(0, horizon, W, horizon);
  });
  return g;
}
function drawBattery(g, x, y, frac, fill, stroke = COL.paper) {
  g.lineStyle(3, stroke).strokeRect(x, y, 44, 22);
  g.fillStyle(stroke).fillRect(x + 44, y + 6, 5, 10);
  if (frac > 0) g.fillStyle(fill).fillRect(x + 4, y + 4, 36 * Math.min(1, frac), 14);
}

// ============================================================
//  Basisklasse für alle Minigames
// ============================================================
class MicroGame extends Phaser.Scene {
  // meta: { title, hint, duration (ms), bg, survive (Zeit überleben = Sieg), timeoutMsg }
  constructor(key, meta) { super(key); this.meta = meta; }

  create() {
    this.done = false;
    this.spd = State.speed;
    this.total = this.meta.duration / this.spd;
    this.left = this.total;
    this.lastSec = 99;
    this.cameras.main.setBackgroundColor(this.meta.bg);
    this.events.once('shutdown', () => {
      this.input.removeAllListeners();
      this.input.keyboard.removeAllListeners();
    });
    this.input.keyboard.addCapture('SPACE,UP,DOWN,LEFT,RIGHT');

    this.setup();

    // Zündschnur unten
    this.add.rectangle(0, H - 12, W, 12, INK).setOrigin(0, 0).setDepth(90);
    this.bar = this.add.rectangle(0, H - 12, W, 12, 0x39FF14).setOrigin(0, 0).setDepth(91);
    this.add.text(W / 2, H - 16, this.meta.hint, {
      fontFamily: BODY, fontSize: '22px', color: NEON.cyan,
      backgroundColor: INK_S, padding: { x: 10, y: 2 }
    }).setOrigin(0.5, 1).setDepth(92);

    // Große Ansage
    const t = big(this, W / 2, H / 2 - 20, this.meta.title, 66, NEON.yellow).setDepth(100);
    const s0 = t.scale;
    t.setScale(s0 * 2);
    this.tweens.add({ targets: t, scale: s0, duration: 220, ease: 'Back.easeOut' });
    this.tweens.add({ targets: t, alpha: 0, y: t.y - 40, delay: 620, duration: 240, ease: 'Quad.easeIn' });
  }

  update(time, delta) {
    if (this.done) return;
    const dt = Math.min(delta, 50) / 1000;
    this.left -= delta;
    const frac = Math.max(0, this.left / this.total);
    this.bar.scaleX = frac;
    if (this.left < 1000) this.bar.setFillStyle(COL.alarm);
    const sec = Math.ceil(this.left / 1000);
    if (sec <= 3 && sec < this.lastSec && sec > 0) { this.lastSec = sec; Sfx.tick(); }

    this.step(dt);

    if (!this.done && this.left <= 0) {
      if (this.meta.survive) this.win(this.meta.winMsg || 'Überlebt!');
      else this.lose(this.meta.timeoutMsg || 'Zu langsam!');
    }
  }

  win(msg) {
    if (this.done) return;
    this.done = true;
    State.result = { ok: true, msg };
    Sfx.win();
    if (this.onWin) this.onWin();
    this.cameras.main.flash(180, 63, 208, 122);
    this.time.delayedCall(750, () => this.scene.start('Transition'));
  }

  lose(msg) {
    if (this.done) return;
    this.done = true;
    State.result = { ok: false, msg };
    Sfx.lose();
    if (this.onLose) this.onLose();
    this.cameras.main.shake(260, 0.012);
    this.time.delayedCall(this.loseDelay || 750, () => this.scene.start('Transition'));
  }

  // Leertaste
  onAction(fn) {
    this.input.keyboard.on('keydown-SPACE', e => { if (!e.repeat) fn(); });
  }

  setup() {}
  step(dt) {}
}

// ============================================================
//  1) FENSTER ZU! – Timing
// ============================================================
class FensterZu extends MicroGame {
  constructor() {
    super('FensterZu', { title: 'FENSTER ZU!', hint: 'Leertaste, wenn es GENAU zu ist', duration: 4200, bg: COL.wall, timeoutMsg: 'Zu lange gezögert. Es zieht.' });
  }
  setup() {
    this.p = 0; this.dir = 1; this.locked = false;
    this.win_ = { x: 150, y: 60, w: 270, h: 250 };
    this.zone = [0.86, 0.94];

    // Heizkörper unterm Fenster
    const deco = this.add.graphics();
    deco.fillStyle(0xBFC7BC).fillRect(165, 330, 240, 22);
    deco.lineStyle(2, 0x9AA396);
    for (let x = 175; x < 400; x += 14) deco.lineBetween(x, 332, x, 350);

    this.gWin = this.add.graphics();

    // Messleiste
    const m = this.m = { x: 150, y: 372, w: 500, h: 24 };
    const g = this.add.graphics();
    g.fillStyle(COL.ink).fillRect(m.x - 4, m.y - 4, m.w + 8, m.h + 8);
    g.fillStyle(0x7D8A80).fillRect(m.x, m.y, m.w, m.h);
    g.fillStyle(COL.good).fillRect(m.x + m.w * this.zone[0], m.y, m.w * (this.zone[1] - this.zone[0]), m.h);
    g.fillStyle(COL.alarm).fillRect(m.x + m.w * this.zone[1], m.y, m.w * (1 - this.zone[1]), m.h);
    body(this, m.x + 20, m.y - 14, 'offen', 13, '#10231A');
    body(this, m.x + m.w * 0.9, m.y - 14, '100 % ZU', 13, '#10231A', { fontStyle: '800' });
    body(this, m.x + m.w + 8, m.y - 14, 'zu fest', 13, '#E2382B', { fontStyle: '800' });
    this.marker = this.add.rectangle(m.x, m.y + m.h / 2, 8, m.h + 18, COL.ink);

    // Lüftung
    const house = this.add.graphics();
    house.fillStyle(0xB8C1B6).fillRect(560, 70, 150, 150);
    house.lineStyle(5, COL.ink).strokeRect(560, 70, 150, 150);
    house.fillStyle(0x56625A).fillCircle(635, 145, 62);
    this.fan = this.add.graphics({ x: 635, y: 145 });
    this.fan.fillStyle(0xD7DDD3);
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI * 2 / 3;
      const pt = (r, da) => ({ x: Math.cos(a + da) * r, y: Math.sin(a + da) * r });
      this.fan.fillPoints([{ x: 0, y: 0 }, pt(56, -0.28), pt(58, 0.22)], true);
    }
    this.fan.fillStyle(COL.ink).fillCircle(0, 0, 9);
    this.fanTxt = txt(this, 635, 245, 'LÜFTUNG: AUS', 18, '#E2382B');

    this.onAction(() => this.press());
    this.drawWindow();
  }
  drawWindow() {
    const g = this.gWin, { x, y, w, h } = this.win_;
    const gap = (1 - this.p) * 90, sw = w - gap;
    g.clear();
    g.fillStyle(0x8EC6E6).fillRect(x, y, w, h);              // draußen
    g.fillStyle(0xFFFFFF, 0.8).fillCircle(x + w - 30, y + 60, 16).fillCircle(x + w - 50, y + 66, 13);
    g.fillStyle(0xCDE9F3).fillRect(x + 6, y + 6, sw - 12, h - 12);   // Glas
    g.lineStyle(10, COL.paper).strokeRect(x + 5, y + 5, sw - 10, h - 10);
    g.fillStyle(COL.ink).fillRect(x + sw - 26, y + h / 2 - 20, 8, 40); // Griff
    if (gap > 8) {                                              // Zugluft
      g.lineStyle(3, COL.paper, 0.9);
      for (let i = 0; i < 3; i++) g.lineBetween(x + sw + 4, y + 70 + i * 50, x + sw - 40, y + 80 + i * 50);
    }
    g.lineStyle(10, 0x5B6B60).strokeRect(x, y, w, h);           // Rahmen
    g.fillStyle(0x9AA396).fillRect(x - 16, y + h, w + 32, 12);   // Fensterbank
  }
  step(dt) {
    if (this.locked) return;
    this.p += this.dir * dt / (0.95 / this.spd);
    if (this.p >= 1) { this.p = 1; this.dir = -1; }
    if (this.p <= 0) { this.p = 0; this.dir = 1; }
    this.marker.x = this.m.x + this.m.w * this.p;
    this.drawWindow();
  }
  press() {
    if (this.locked || this.done) return;
    this.locked = true;
    if (this.p >= this.zone[0] && this.p <= this.zone[1]) {
      this.p = 1; this.drawWindow();
      this.fanTxt.setText('LÜFTUNG: AN').setColor('#1E8A4C');
      this.tweens.add({ targets: this.fan, angle: 1440, duration: 1100, ease: 'Quad.easeIn' });
      this.win('Lüftung läuft. Zum ersten Mal seit Jahren.');
    } else {
      const msg = this.p > this.zone[1] ? 'Zu fest gedrückt. Fenster springt wieder auf.' : 'Nicht ganz zu. Lüftung bleibt aus.';
      this.tweens.addCounter({ from: this.p, to: 0, duration: 260, ease: 'Back.easeOut', onUpdate: tw => { this.p = tw.getValue(); this.drawWindow(); } });
      this.lose(msg);
    }
  }
}

// ============================================================
//  2) WLAN FANGEN! – Verfolgen
// ============================================================
class WlanFangen extends MicroGame {
  constructor() {
    super('WlanFangen', { title: 'WLAN FANGEN!', hint: 'Pfeiltasten: Laptop ins Signal halten, bis der Upload durch ist', duration: 5200, bg: COL.slate, timeoutMsg: 'Upload abgebrochen. eduroam halt.' });
  }
  setup() {
    const bg = this.add.graphics();
    bg.lineStyle(10, 0x2E3F48);
    for (let y = 140; y < 420; y += 60) bg.lineBetween(30, y, 770, y);   // Sitzreihen

    this.r = Math.max(50, 74 - (this.spd - 1) * 40);
    this.sig = { x: W * 0.65, y: H * 0.55, vx: 0, vy: 0, on: true };
    this.retarget = 0;
    this.blink = 1.2 + Math.random() * 0.6;
    this.sigG = this.add.graphics();

    this.lap = { x: 190, y: 300 };
    this.tgt = { x: 190, y: 300 };
    this.lapG = this.add.graphics().setDepth(5);

    // Upload-Fenster
    const p = this.add.graphics().setDepth(20);
    p.fillStyle(COL.ink).fillRoundedRect(150, 22, 500, 62, 6);
    p.fillStyle(0x3A4A52).fillRect(166, 62, 468, 10);
    this.add.text(166, 32, 'abgabe_final_v3_WIRKLICH_final.zip', { fontFamily: BODY, fontSize: '19px', color: '#F5F7F2' }).setDepth(21);
    this.status = this.add.text(634, 33, '', { fontFamily: BODY, fontSize: '18px', color: '#E2382B' }).setOrigin(1, 0).setDepth(21);
    this.up = this.add.rectangle(166, 62, 468, 10, COL.good).setOrigin(0, 0).setDepth(21);
    this.up.scaleX = 0;
    this.prog = 0;
    this.need = 2.4 / this.spd;

    this.keys = this.input.keyboard.createCursorKeys();
    this.drawAll(false);
  }
  randomSpot() {
    return { x: Phaser.Math.Between(this.r + 20, W - this.r - 20), y: Phaser.Math.Between(100 + this.r, H - 36 - this.r) };
  }
  step(dt) {
    const k = this.keys, mv = 340 * dt;
    if (k.left.isDown) this.tgt.x -= mv;
    if (k.right.isDown) this.tgt.x += mv;
    if (k.up.isDown) this.tgt.y -= mv;
    if (k.down.isDown) this.tgt.y += mv;
    this.tgt.x = Phaser.Math.Clamp(this.tgt.x, 30, W - 30);
    this.tgt.y = Phaser.Math.Clamp(this.tgt.y, 100, H - 40);
    const f = Math.min(1, dt * 12);
    this.lap.x += (this.tgt.x - this.lap.x) * f;
    this.lap.y += (this.tgt.y - this.lap.y) * f;

    const s = this.sig;
    this.retarget -= dt;
    if (this.retarget <= 0) {
      const a = Math.random() * Math.PI * 2, sp = (110 + Math.random() * 90) * this.spd;
      s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
      this.retarget = 0.45 + Math.random() * 0.6;
    }
    s.x += s.vx * dt; s.y += s.vy * dt;
    const minX = this.r + 10, maxX = W - this.r - 10, minY = 96 + this.r, maxY = H - 34 - this.r;
    if (s.x < minX || s.x > maxX) { s.vx *= -1; s.x = Phaser.Math.Clamp(s.x, minX, maxX); }
    if (s.y < minY || s.y > maxY) { s.vy *= -1; s.y = Phaser.Math.Clamp(s.y, minY, maxY); }

    // eduroam-Aussetzer: Signal verschwindet und taucht woanders auf
    this.blink -= dt;
    if (this.blink <= 0 && s.on) {
      this.blink = 1.3 + Math.random();
      s.on = false;
      this.time.delayedCall(320 / this.spd, () => { Object.assign(s, this.randomSpot()); s.on = true; });
    }

    const inside = s.on && Phaser.Math.Distance.Between(s.x, s.y, this.lap.x, this.lap.y) < this.r;
    if (inside) this.prog += dt / this.need;
    this.up.scaleX = Math.min(1, this.prog);
    this.status.setText(inside ? 'verbunden' : (s.on ? 'Verbindung getrennt' : 'eduroam sucht …'));
    this.status.setColor(inside ? '#3FD07A' : '#E2382B');
    this.drawAll(inside);

    if (this.prog >= 1) this.win('Abgabe hochgeladen. Um 23:59.');
  }
  drawAll(inside) {
    const g = this.sigG, s = this.sig;
    g.clear();
    if (s.on) {
      const c = inside ? COL.good : COL.hazard;
      g.fillStyle(c, 0.16).fillCircle(s.x, s.y, this.r);
      g.lineStyle(3, c, 0.7).strokeCircle(s.x, s.y, this.r);
      g.lineStyle(5, c);
      for (let i = 1; i <= 3; i++) {
        g.beginPath();
        g.arc(s.x, s.y + 14, i * 11, -Math.PI * 0.78, -Math.PI * 0.22, false);
        g.strokePath();
      }
      g.fillStyle(c).fillCircle(s.x, s.y + 14, 4);
    }
    const l = this.lapG, { x, y } = this.lap;
    l.clear();
    l.fillStyle(0x1A1A1A).fillRoundedRect(x - 26, y - 22, 52, 32, 3);
    l.fillStyle(inside ? COL.good : 0x6B7A82).fillRect(x - 22, y - 18, 44, 24);
    l.fillStyle(0x9BA4A8).fillRect(x - 32, y + 10, 64, 6);
  }
}

// ============================================================
//  3) PLATZ FINDEN! – Wettrennen
// ============================================================
class Sitzplatz extends MicroGame {
  constructor() {
    super('Sitzplatz', { title: 'PLATZ FINDEN!', hint: 'Pfeiltasten: lauf zu einem freien Stuhl', duration: 4600, bg: COL.floor, timeoutMsg: 'Stehplatz. Wie jede Woche.' });
  }
  setup() {
    const g = this.add.graphics();
    g.fillStyle(COL.paper).fillRect(270, 8, 260, 16);           // Tafel
    g.lineStyle(3, COL.ink).strokeRect(270, 8, 260, 16);
    g.fillStyle(COL.exit).fillRect(20, 396, 46, 40).fillRect(734, 396, 46, 40); // Türen
    body(this, 400, 38, 'Prof. gleich da', 13, '#10231A');

    const rowsY = [115, 190, 265];
    rowsY.forEach((y, r) => {
      if (r < 2) g.fillStyle(0x8B6B47).fillRect(125, y - 34, 550, 12);   // Tische
    });
    body(this, 80, 265, 'ohne\nTisch', 12, '#10231A', { fontStyle: '800' });

    this.seats = [];
    const all = [];
    rowsY.forEach((y, r) => { for (let i = 0; i < 7; i++) all.push({ x: 160 + i * 80, y, row: r }); });
    const freeIdx = Phaser.Utils.Array.Shuffle([...all.keys()]).slice(0, 5);
    all.forEach((s, i) => {
      s.taken = !freeIdx.includes(i);
      s.chair = this.add.rectangle(s.x, s.y, 36, 30, COL.chair).setStrokeStyle(3, COL.ink);
      if (s.taken) this.add.circle(s.x, s.y, 12, Phaser.Utils.Array.GetRandom(STUDENT_COLORS)).setStrokeStyle(2, COL.ink);
      this.seats.push(s);
    });

    this.rivals = [];
    for (let i = 0; i < 6; i++) {
      const x = Phaser.Math.Between(60, 740), y = Phaser.Math.Between(395, 425);
      const c = this.add.circle(x, y, 12, Phaser.Utils.Array.GetRandom(STUDENT_COLORS)).setStrokeStyle(2, COL.ink);
      this.rivals.push({ x, y, c, v: (85 + Math.random() * 40) * this.spd, delay: Math.random() * 0.45, target: null, seated: false });
    }

    this.pl = { x: 400, y: 412 };
    this.plC = this.add.circle(400, 412, 15, COL.hazard).setStrokeStyle(4, COL.ink).setDepth(5);
    this.plL = body(this, 400, 412, 'DU', 11, '#10231A', { fontStyle: '800' }).setDepth(6);

    this.freeTxt = this.add.text(780, 10, '', { fontFamily: FONT, fontSize: '14px', color: '#10231A' }).setOrigin(1, 0);
    this.keys = this.input.keyboard.createCursorKeys();
    this.updateFree();
  }
  free() { return this.seats.filter(s => !s.taken); }
  updateFree() { this.freeTxt.setText('FREI: ' + this.free().length); }
  step(dt) {
    // Spieler
    const k = this.keys, v = 250 * this.spd * dt;
    const kx = (k.right.isDown ? 1 : 0) - (k.left.isDown ? 1 : 0), ky = (k.down.isDown ? 1 : 0) - (k.up.isDown ? 1 : 0);
    if (kx || ky) {
      const n = Math.hypot(kx, ky);
      this.pl.x += kx / n * v; this.pl.y += ky / n * v;
    }
    this.pl.x = Phaser.Math.Clamp(this.pl.x, 20, W - 20);
    this.pl.y = Phaser.Math.Clamp(this.pl.y, 60, H - 30);
    this.plC.setPosition(this.pl.x, this.pl.y);
    this.plL.setPosition(this.pl.x, this.pl.y);

    // Konkurrenz
    for (const r of this.rivals) {
      if (r.seated) continue;
      if (r.delay > 0) { r.delay -= dt; continue; }
      if (!r.target || r.target.taken) {
        const f = this.free();
        if (!f.length) continue;
        f.sort((a, b) => Phaser.Math.Distance.Between(r.x, r.y, a.x, a.y) - Phaser.Math.Distance.Between(r.x, r.y, b.x, b.y));
        r.target = Phaser.Utils.Array.GetRandom(f.slice(0, 3));
      }
      const dx = r.target.x - r.x, dy = r.target.y - r.y, d = Math.hypot(dx, dy), m = Math.min(d, r.v * dt);
      r.x += dx / d * m; r.y += dy / d * m;
      r.c.setPosition(r.x, r.y);
      if (d < 4) { r.target.taken = true; r.seated = true; Sfx.blip(); this.updateFree(); }
    }

    // Spieler erreicht Stuhl?
    for (const s of this.free()) {
      if (Phaser.Math.Distance.Between(this.pl.x, this.pl.y, s.x, s.y) < 22) {
        s.taken = true;
        this.updateFree();
        this.win(s.row === 2 ? 'Sitzplatz! Ohne Tisch, aber immerhin.' : 'Platz MIT Tisch. Jackpot.');
        return;
      }
    }
    if (!this.free().length) this.lose('Alle Plätze weg. Boden it is.');
  }
}

// ============================================================
//  4) FEUERALARM! – Top-down-Runner auf der Trichtertreppe
//     Links gerade Wand, rechts läuft der Trichter zur Mitte zu,
//     das nachgerüstete Geländer steckt den nutzbaren Teil ab.
// ============================================================
class Fluchttreppe extends MicroGame {
  constructor() {
    super('Fluchttreppe', { title: 'FEUERALARM!', hint: '← → ausweichen · ↑ / Leertaste springen', duration: 6000, bg: 0x232B30, survive: true, winMsg: 'Draußen! Sammelplatz erreicht.' });
  }
  Y(s) { return this.PY - (s - this.sP); }          // Weltposition → Bildschirm-y (vorwärts = nach oben)
  setup() {
    this.LW = 150;                 // linke Wand (gerade)
    this.RAIL = 452;               // nachgerüstetes Geländer (gerade)
    this.EDGE0 = 760;              // Trichterkante oben am Lauf (breit)
    this.EDGE1 = 470;              // Trichterkante unten (fast am Geländer)
    this.FLIGHT = 1880; this.D = 1980;  // EIN langer Lauf vom 1. OG ins EG, Podest unten, dann raus
    this.PY = 300;
    this.lanes = [200, 300, 400];
    this.NAMES = ['1. OG', 'EG'];
    this.sP = 0;
    this.v = this.D / (this.total / 1000);       // kommt genau bei Zeitende unten an
    this.lane = 1;
    this.jumpT = 0; this.jumpDur = 0.42;
    this.inv = 0;
    this.fireDist = 150;
    this.fireCreep = 9;
    this.hitCost = 58;

    this.bgG = this.add.graphics();
    this.labels = this.NAMES.map(n => txt(this, 0, 0, n, 24, '#10231A').setAlpha(0.5).setDepth(2));
    this.deadLbl = [300, 1000].map(s => ({ s, t: body(this, 0, 0, 'TOTER\nTRICHTER', 12, '#F5F7F2', { fontStyle: '800' }).setAlpha(0.75).setDepth(2) }));
    this.exitLbl = txt(this, 0, 0, 'NOTAUSGANG', 22, '#F5F7F2').setDepth(2);

    // Hindernisreihen: höchstens 2 von 3 Spuren blockiert
    this.obs = [];
    for (let s = 380; s < this.D - 120; s += Phaser.Math.Between(105, 150)) {
      const r = Math.random(), L = Phaser.Utils.Array.Shuffle([0, 1, 2]);
      if (r < 0.22) this.addObs(s, 'person', [L[0]]);
      else if (r < 0.38) this.addObs(s, 'bag', [L[0]]);
      else if (r < 0.62) { const a = Math.random() < 0.5 ? 0 : 1; this.addObs(s, 'group', [a, a + 1]); }
      else if (r < 0.80) { this.addObs(s, 'person', [L[0]]); this.addObs(s, 'bag', [L[1]]); }
      else {                                                       // Spurwechsler: biegt kurz vorher ab
        const from = L[0], to = from === 0 ? 1 : from === 2 ? 1 : (Math.random() < 0.5 ? 0 : 2);
        this.addObs(s, 'person', [from]).wander = to;
      }
    }

    this.shadow = this.add.ellipse(this.lanes[1], this.PY + 4, 36, 20, 0x000000, 0.3).setDepth(9);
    const pg = this.add.graphics();
    pg.fillStyle(0x2E5E8C).fillRoundedRect(-10, 2, 20, 13, 3);      // Rucksack
    pg.fillStyle(COL.hazard).fillEllipse(0, 0, 38, 22);           // Schultern
    pg.fillStyle(0x3B2A20).fillCircle(0, -3, 10);                 // Kopf von oben
    this.player = this.add.container(this.lanes[1], this.PY, [pg]).setDepth(10);

    this.heat = this.add.rectangle(0, 0, W, H, COL.alarm, 0).setOrigin(0, 0).setDepth(14);
    this.fireG = this.add.graphics().setDepth(15);

    // Steuerung
    const kb = this.input.keyboard;
    kb.on('keydown-LEFT', () => this.setLane(this.lane - 1));
    kb.on('keydown-A', () => this.setLane(this.lane - 1));
    kb.on('keydown-RIGHT', () => this.setLane(this.lane + 1));
    kb.on('keydown-D', () => this.setLane(this.lane + 1));
    kb.on('keydown-UP', () => this.jump());
    kb.on('keydown-W', () => this.jump());
    kb.on('keydown-SPACE', e => { if (!e.repeat) this.jump(); });

    this.drawWorld(); this.placeObs(); this.drawFire();
  }
  drawPerson(g, dx, color) {
    g.fillStyle(color).fillEllipse(dx, 0, 34, 20);
    g.fillStyle(0x3B2A20).fillCircle(dx, -1, 9);
    g.fillStyle(0xDDE6EA).fillRect(dx - 4, -18, 8, 6);           // Handy vor der Nase
  }
  addObs(s, type, lanes) {
    const g = this.add.graphics().setDepth(8);
    const x = lanes.reduce((a, l) => a + this.lanes[l], 0) / lanes.length;
    if (type === 'person') this.drawPerson(g, 0, Phaser.Utils.Array.GetRandom(STUDENT_COLORS));
    else if (type === 'group') { this.drawPerson(g, -50, Phaser.Utils.Array.GetRandom(STUDENT_COLORS)); this.drawPerson(g, 50, Phaser.Utils.Array.GetRandom(STUDENT_COLORS)); }
    else {                                                        // Rucksack am Boden: drüberspringen
      g.fillStyle(0x000000, 0.25).fillEllipse(2, 4, 32, 14);
      g.fillStyle(0x2C9C8F).fillRoundedRect(-14, -10, 28, 20, 5);
      g.lineStyle(3, 0x1C6F65).lineBetween(-8, -10, -8, 10).lineBetween(8, -10, 8, 10);
    }
    const o = { s, type, lanes, x, g, low: type === 'bag', hit: false };
    this.obs.push(o);
    return o;
  }
  setLane(l) {
    if (this.done) return;
    if (l < 0 || l > 2) {                                         // Wand oder Geländer
      Sfx.tone(120, 0.08, 'square', 0.05);
      this.tweens.add({ targets: this.player, x: this.lanes[this.lane] + (l < 0 ? -12 : 12), duration: 50, yoyo: true });
      return;
    }
    this.lane = l;
    Sfx.tone(420, 0.04, 'triangle', 0.06);
    this.tweens.add({ targets: this.player, x: this.lanes[l], duration: 90, ease: 'Quad.easeOut' });
  }
  jump() {
    if (this.done || this.jumpT > 0) return;
    this.jumpT = this.jumpDur;
    Sfx.tone(480, 0.1, 'triangle', 0.07, 300);
  }
  hitObs(o) {
    o.hit = true;
    this.fireDist -= this.hitCost;
    this.inv = 0.5;
    Sfx.tone(180, 0.18, 'sawtooth', 0.07, -80);
    this.cameras.main.shake(140, 0.008);
    this.tweens.add({ targets: o.g, alpha: 0.3, duration: 200 });
    const t = txt(this, this.player.x, this.PY - 30, o.low ? 'ÜBER DEN RUCKSACK!' : 'SORRY!', 16, '#FFC61A', { stroke: '#10231A', strokeThickness: 5 }).setDepth(20);
    this.tweens.add({ targets: t, y: t.y - 40, alpha: 0, duration: 600, onComplete: () => t.destroy() });
  }
  edgeAt(s) {                                                    // Trichterkante läuft langsam zur Mitte
    const f = Phaser.Math.Clamp(s / this.FLIGHT, 0, 1);
    return this.EDGE0 + (this.EDGE1 - this.EDGE0) * f;
  }
  drawWorld() {
    const g = this.bgG, { LW, RAIL, FLIGHT, D } = this;
    g.clear();
    const yD = this.Y(D);
    if (yD > -20) {                                               // draußen: Sammelplatz
      g.fillStyle(0x4E8A3C).fillRect(0, -10, W, yD + 10);
      g.fillStyle(COL.exit).fillRect(LW - 14, yD - 8, this.EDGE1 - LW + 14, 16);
    }
    this.exitLbl.setPosition((LW + this.EDGE1) / 2, yD - 34);
    const wallTop = Math.max(-10, yD);
    g.fillStyle(0x3B454B).fillRect(LW - 14, wallTop, 14, H + 20 - wallTop);

    // sichtbarer Ausschnitt der Treppe
    const sLo = Math.max(0, this.sP - (H - this.PY) - 20), sHi = Math.min(FLIGHT, this.sP + this.PY + 20);
    if (sHi > sLo) {
      const y0 = this.Y(sLo), y1 = this.Y(sHi), e0 = this.edgeAt(sLo), e1 = this.edgeAt(sHi);
      g.fillStyle(0x8A949A).fillPoints([{ x: LW, y: y0 }, { x: e0, y: y0 }, { x: e1, y: y1 }, { x: LW, y: y1 }], true);
      for (let st = Math.ceil(sLo / 22) * 22; st < sHi; st += 22) {   // Stufen
        const y = this.Y(st), e = this.edgeAt(st);
        g.lineStyle(2, 0x6F7980).lineBetween(LW, y, e, y);
        g.lineStyle(3, COL.hazard).lineBetween(LW, y, LW + 18, y);
      }
      g.fillStyle(COL.alarm, 0.18).fillPoints([{ x: RAIL, y: y0 }, { x: e0, y: y0 }, { x: e1, y: y1 }, { x: RAIL, y: y1 }], true);
      g.lineStyle(5, 0x3B454B).lineBetween(e0, y0, e1, y1);           // Trichterkante
      g.lineStyle(10, COL.ink).lineBetween(RAIL, y0, RAIL, y1);       // Geländer
      g.lineStyle(5, 0xD9DEE1).lineBetween(RAIL, y0, RAIL, y1);
      for (const es of [120, 700, 1350]) {                            // gestrandete Erstis im Trichter
        const ey = this.Y(es);
        if (ey < -20 || ey > H + 20) continue;
        const ex = (RAIL + this.edgeAt(es)) / 2 + 10;
        g.fillStyle(0x7A4FB5).fillEllipse(ex, ey, 30, 18);
        g.fillStyle(0x3B2A20).fillCircle(ex, ey, 8);
      }
    }
    for (const d of this.deadLbl) d.t.setPosition((RAIL + this.edgeAt(d.s)) / 2 + 10, this.Y(d.s));

    // Podest oben (1. OG) und unten (EG)
    const landings = [[-100, 0, this.EDGE0], [FLIGHT, D, this.EDGE1]];
    landings.forEach(([a, b, e], i) => {
      const ya = this.Y(a), yb = this.Y(b);
      if (ya > -20 && yb < H + 20) g.fillStyle(0x9AA3A8).fillRect(LW, yb, e - LW, ya - yb);
      this.labels[i].setPosition((LW + e) / 2, (ya + yb) / 2);
    });
  }
  placeObs() {
    for (const o of this.obs) {
      const y = this.Y(o.s);
      o.g.setPosition(o.x, y).setVisible(y > -40 && y < H + 40);
    }
  }
  drawFire() {
    const g = this.fireG, top = this.PY + this.fireDist, t = this.left / 1000;
    g.clear();
    g.fillStyle(0xB3261E).fillRect(0, top, W, H - top + 10);
    for (let x = -10; x < W + 20; x += 34) {
      const h = 30 + 14 * Math.sin(t * 14 + x * 0.31) + Math.random() * 6;
      g.fillStyle(COL.alarm).fillTriangle(x, top + 2, x + 34, top + 2, x + 17, top - h);
      g.fillStyle(0xFF8A1E).fillTriangle(x + 6, top + 4, x + 28, top + 4, x + 17, top - h * 0.55);
      g.fillStyle(COL.hazard).fillTriangle(x + 11, top + 6, x + 23, top + 6, x + 17, top - h * 0.28);
    }
    this.heat.setFillStyle(COL.alarm, Phaser.Math.Clamp((100 - this.fireDist) / 100, 0, 1) * 0.28);
  }
  step(dt) {
    this.sP += this.v * dt;
    if (this.jumpT > 0) this.jumpT = Math.max(0, this.jumpT - dt);
    if (this.inv > 0) this.inv -= dt;
    this.fireDist -= this.fireCreep * this.spd * dt;

    for (const o of this.obs) {                                    // Spurwechsler biegen ab
      if (o.wander === undefined || o.moved || o.s - this.sP > 250) continue;
      o.moved = true;
      this.tweens.add({ targets: o, x: this.lanes[o.wander], duration: 320, ease: 'Sine.easeInOut' });
      this.time.delayedCall(140, () => { o.lanes = [o.wander]; });
    }

    for (const o of this.obs) {
      if (o.hit || Math.abs(o.s - this.sP) > 20 || !o.lanes.includes(this.lane)) continue;
      if (o.low && this.jumpT > 0) continue;
      if (this.inv > 0) continue;
      this.hitObs(o);
      break;
    }

    const j = this.jumpT > 0 ? Math.sin((1 - this.jumpT / this.jumpDur) * Math.PI) : 0;
    this.player.setScale(1 + j * 0.45);
    this.player.y = this.PY - j * 8;
    this.player.alpha = this.inv > 0 && Math.floor(this.inv * 20) % 2 ? 0.4 : 1;
    this.shadow.setPosition(this.player.x, this.PY + 4).setScale(1 - j * 0.35);

    this.drawWorld();
    this.placeObs();
    this.drawFire();
    if (this.fireDist <= 14) this.lose('Vom Feuer eingeholt. Zu oft gestolpert.');
  }
}

// ============================================================
//  6) KLO FINDEN! – Stockwerk-Hopping gegen gesperrte Toiletten
// ============================================================
class KloFinden extends MicroGame {
  constructor() {
    super('KloFinden', { title: 'KLO FINDEN!', hint: '↑ ↓ Stockwerk wechseln', duration: 6500, bg: 0xCBD3C7, timeoutMsg: 'Zu spät. Wir reden nicht drüber.' });
  }
  floorY(f) { return this.TOP + (5 - f) * this.BAND; }   // y der Bodenkante, auch für Zwischenwerte
  setup() {
    this.FL = ['EG', '1. OG', '2. OG', '3. OG', '4. OG'];
    this.BAND = 76; this.TOP = 8; this.stairX = 150;
    this.LABELS = ['GESPERRT', 'Außer Betrieb', 'Reinigung', 'Wasserschaden', 'Nur Personal', 'Defekt seit 2019', 'Bitte EG nutzen'];
    this.openDur = 2.2 / this.spd;
    this.gap = 1.25 / this.spd;
    this.spawnT = this.gap;

    const g = this.add.graphics();
    for (let i = 0; i < 5; i++) {
      const yb = this.floorY(i), yt = yb - this.BAND;
      g.fillStyle(i % 2 ? 0xD7DDD3 : 0xC6CFC2).fillRect(0, yt, W, this.BAND);
      g.fillStyle(0x5B6B60).fillRect(0, yb - 5, W, 5);
      body(this, 42, yb - 36, this.FL[i], 15, '#10231A', { fontStyle: '800' });
      if (i < 4) {   // Treppe hoch ins nächste Stockwerk
        g.fillStyle(0x8E989E);
        for (let s = 0; s < 6; s++) g.fillRect(112 + s * 13, yb - 5 - (s + 1) * 12, 13, (s + 1) * 12);
      }
    }
    this.hl = this.add.rectangle(0, 0, W, this.BAND - 5, COL.hazard, 0.22).setOrigin(0, 0);

    this.doors = [];
    for (let i = 0; i < 5; i++) {
      const d = { x: Phaser.Math.Between(430, 730), state: 'closed', t: 0, label: Phaser.Utils.Array.GetRandom(this.LABELS) };
      d.sign = this.add.text(d.x, this.floorY(i) - 66, '', { fontFamily: BODY, fontSize: '15px', color: '#F5F7F2', padding: { x: 5, y: 2 } }).setOrigin(0.5, 1).setDepth(6);
      this.doors.push(d);
    }
    // Start: man steht im 2. OG, das nächste Klo öffnet ganz unten
    this.doors[0].state = 'soon'; this.doors[0].t = 0.9 / this.spd;
    this.doorG = this.add.graphics().setDepth(5);
    this.refreshSigns();

    const pg = this.add.graphics();
    pg.fillStyle(INK).fillRect(-9, -8, 7, 8).fillRect(2, -8, 7, 8);
    drawBean(pg, 0, -4, 0.85, 0xFFC234, 'worried');
    this.player = this.add.container(0, 0, [pg]).setDepth(10);
    this.bubble = txt(this, 0, 0, 'ZU!', 16, '#E2382B', { stroke: '#F5F7F2', strokeThickness: 5 }).setDepth(12).setVisible(false);

    this.pl = { fy: 2, x: this.stairX + 60 };
    this.target = 2;
    this.knocked = false;
    this.hl.y = this.floorY(2) - this.BAND;

    this.input.keyboard.on('keydown-UP', () => this.setTarget(this.target + 1));
    this.input.keyboard.on('keydown-DOWN', () => this.setTarget(this.target - 1));
    this.placePlayer(0);
    this.drawDoors();
  }
  setTarget(i) {
    i = Phaser.Math.Clamp(i, 0, 4);
    if (i === this.target || this.done) return;
    this.target = i;
    this.knocked = false;
    this.bubble.setVisible(false);
    this.hl.y = this.floorY(i) - this.BAND;
    Sfx.blip();
  }
  refreshSigns() {
    for (const d of this.doors) {
      if (d.state === 'open') d.sign.setText('WC').setBackgroundColor('#1E8A4C');
      else if (d.state === 'soon') d.sign.setText('gleich frei').setBackgroundColor('#B8860B');
      else d.sign.setText(d.label).setBackgroundColor('#E2382B');
    }
  }
  drawDoors() {
    const g = this.doorG;
    g.clear();
    this.doors.forEach((d, i) => {
      const yb = this.floorY(i) - 5, x = d.x;
      const closing = d.state === 'open' && d.t < 0.55 / this.spd;
      g.fillStyle(d.state === 'open' ? COL.chair : 0x7D8A80).fillRect(x - 22, yb - 54, 44, 54);
      g.lineStyle(3, COL.ink).strokeRect(x - 22, yb - 54, 44, 54);
      g.fillStyle(COL.ink).fillCircle(x + 14, yb - 26, 3);
      if (d.state === 'closed') {   // Absperrband
        g.fillStyle(COL.alarm);
        g.fillPoints([{ x: x - 26, y: yb - 46 }, { x: x - 20, y: yb - 52 }, { x: x + 26, y: yb - 10 }, { x: x + 20, y: yb - 4 }], true);
        g.fillPoints([{ x: x + 26, y: yb - 46 }, { x: x + 20, y: yb - 52 }, { x: x - 26, y: yb - 10 }, { x: x - 20, y: yb - 4 }], true);
      }
      const lamp = d.state === 'open' ? (closing && Math.floor(this.left / 90) % 2 ? COL.alarm : COL.good)
        : d.state === 'soon' ? COL.hazard : 0x4A5A50;
      g.fillStyle(lamp).fillCircle(x + 30, yb - 50, 5);
      d.sign.setAlpha(closing && Math.floor(this.left / 90) % 2 ? 0.35 : 1);
    });
  }
  placePlayer(dt) {
    const urgency = 1 - this.left / this.total;
    const jitter = Math.sin(this.left / 22) * (1 + urgency * 3);   // Druck steigt
    const y = this.floorY(this.pl.fy) - 5;
    this.player.setPosition(this.pl.x + jitter, y);
    this.bubble.setPosition(this.pl.x, y - 72);
  }
  step(dt) {
    // Türen schalten
    let changed = false;
    for (const d of this.doors) {
      if (d.state === 'closed') continue;
      d.t -= dt;
      if (d.t > 0) continue;
      if (d.state === 'soon') { d.state = 'open'; d.t = this.openDur; }
      else { d.state = 'closed'; d.label = Phaser.Utils.Array.GetRandom(this.LABELS); }
      changed = true;
    }
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = this.gap;
      let cand = this.doors.map((d, i) => i).filter(i => this.doors[i].state === 'closed' && i !== this.target);
      if (!cand.length) cand = this.doors.map((d, i) => i).filter(i => this.doors[i].state === 'closed');
      if (cand.length) {
        const d = this.doors[Phaser.Utils.Array.GetRandom(cand)];
        d.state = 'soon'; d.t = 0.55 / this.spd;
        changed = true;
      }
    }
    if (changed) this.refreshSigns();

    // Spieler: erst zur Treppe, dann Stockwerk wechseln, dann zur Tür
    const p = this.pl, walk = 520 * this.spd * dt;
    const toward = (tx) => { const dx = tx - p.x; p.x += Math.sign(dx) * Math.min(Math.abs(dx), walk); return Math.abs(tx - p.x) < 1; };
    if (Math.abs(p.fy - this.target) > 0.001) {
      if (toward(this.stairX)) {
        const df = this.target - p.fy, m = dt / (0.22 / this.spd);
        p.fy += Math.sign(df) * Math.min(Math.abs(df), m);
      }
    } else {
      p.fy = this.target;
      const d = this.doors[this.target];
      if (toward(d.x)) {
        if (d.state === 'open') {
          this.bubble.setText('PUH!').setColor('#1E8A4C').setVisible(true);
          const f = this.FL[this.target];
          this.win(this.target === 0 ? 'Im EG. Hätte man auch gleich haben können.' : 'Gefunden im ' + f + '. Rettung in letzter Sekunde.');
        } else if (!this.knocked) {
          this.knocked = true;
          Sfx.tone(140, 0.14, 'square', 0.06);
          this.bubble.setText(d.state === 'soon' ? 'GLEICH …' : 'ZU!').setColor(d.state === 'soon' ? '#B8860B' : '#E2382B').setVisible(true);
        } else if (d.state === 'soon') {
          this.bubble.setText('GLEICH …').setColor('#B8860B');
        }
      }
    }
    this.placePlayer(dt);
    this.drawDoors();
  }
  onLose() {   // Zu spät: Hose voll
    this.loseDelay = 2600;
    const px = this.player.x, py = this.player.y, BROWN = 0x6B3F1D;
    this.hl.setVisible(false);
    const dim = this.add.rectangle(0, 0, W, H, COL.ink, 0).setOrigin(0, 0).setDepth(8);
    this.tweens.add({ targets: dim, fillAlpha: 0.55, duration: 400 });
    this.cameras.main.pan(px, py - 40, 600, 'Quad.easeOut');
    this.cameras.main.zoomTo(2, 600, 'Quad.easeOut');
    this.bubble.setText('OH NEIN …').setColor('#6B3F1D').setVisible(true);

    // Zusammenkneifen, dann verlieren
    this.tweens.add({ targets: this.player, scaleX: 1.15, scaleY: 0.85, duration: 90, yoyo: true, repeat: 3 });
    this.time.delayedCall(450, () => {
      Sfx.fart();
      this.cameras.main.shake(400, 0.006);
      const stain = this.add.graphics();
      stain.fillStyle(BROWN, 0.92).fillEllipse(0, -8, 24, 16).fillRect(-9, -6, 7, 7).fillRect(2, -6, 7, 7);
      stain.setScale(0);
      this.player.add(stain);
      this.tweens.add({ targets: stain, scale: 1, duration: 500, ease: 'Back.easeOut' });

      const puddle = this.add.graphics({ x: px, y: py }).setDepth(9).setScale(0, 1);
      puddle.fillStyle(BROWN, 0.85).fillEllipse(0, 1, 56, 8);
      this.tweens.add({ targets: puddle, scaleX: 1, duration: 900, delay: 300, ease: 'Quad.easeOut' });
      for (let i = 0; i < 4; i++) {
        const drop = this.add.circle(px + Phaser.Math.Between(-7, 7), py - 4, 2.5, BROWN).setDepth(11);
        this.tweens.add({ targets: drop, y: py, duration: 260, delay: 150 + i * 180, repeat: 2, repeatDelay: 200, onComplete: () => drop.destroy() });
      }
    });

    // Stinkwolken
    this.time.addEvent({ delay: 170, startAt: -550, repeat: 11, callback: () => {
      const s = this.add.graphics({ x: px + Phaser.Math.Between(-18, 18), y: py - 20 }).setDepth(11);
      s.lineStyle(3, 0x9BBF3A, 0.9).beginPath();
      for (let k = 0; k <= 10; k++) s.lineTo(Math.sin(k * 0.9) * 5, -k * 3);
      s.strokePath();
      this.tweens.add({ targets: s, y: s.y - 45, alpha: 0, duration: 900, onComplete: () => s.destroy() });
    } });

    // Fliegen
    this.time.delayedCall(900, () => {
      this.bubble.setText('💩').setVisible(true);
      this.tweens.add({ targets: this.bubble, scale: { from: 0, to: 1.4 }, duration: 300, ease: 'Back.easeOut' });
      for (let i = 0; i < 3; i++) {
        const fly = this.add.container(px, py - 20, [
          this.add.ellipse(-3, -3, 6, 4, 0xFFFFFF, 0.7), this.add.ellipse(3, -3, 6, 4, 0xFFFFFF, 0.7),
          this.add.circle(0, 0, 2.5, COL.ink)
        ]).setDepth(12);
        const r = 18 + i * 7, ph = i * 2.1;
        this.tweens.addCounter({ from: 0, to: Math.PI * 6, duration: 1700, onUpdate: tw => {
          const a = tw.getValue() * (i % 2 ? -1 : 1) + ph;
          fly.setPosition(px + Math.cos(a) * r, py - 22 + Math.sin(a * 1.7) * r * 0.5);
        } });
      }
    });
  }
}

class Transition extends Phaser.Scene {
  constructor() { super('Transition'); }
  create() {
    this.cameras.main.setBackgroundColor(INK);
    const r = State.result;
    State.result = null;
    if (r) { State.round++; if (r.ok) State.score++; else State.lives--; }
    const dead = State.lives <= 0;
    const spedUp = !!r && !dead && State.round % 5 === 0;
    if (spedUp) { State.speed = Math.round((State.speed + 0.15) * 100) / 100; Music.setSpeed(State.speed); }

    stars(this, 50);
    frame(this, r ? (r.ok ? 0x39FF14 : 0xFF2E88) : 0x00E5FF);

    // HUD wie am Automaten
    [['1UP', pad(State.score * 100)], ['HI-SCORE', pad(Math.max(State.best, State.score) * 100)], ['STAGE', pad(State.round + 1, 2)]].forEach(([k, v], i) => {
      txt(this, 160 + i * 240, 38, k, 18, NEON.pink);
      txt(this, 160 + i * 240, 62, v, 18, '#FFFFFF');
    });

    if (r) {
      big(this, W / 2, 140, r.ok ? 'GESCHAFFT!' : 'DANEBEN!', 46, r.ok ? NEON.green : NEON.pink);
      body(this, W / 2, 190, r.msg, 18, '#FFFFFF');
    } else {
      big(this, W / 2, 140, 'GET READY!', 46, NEON.yellow);
      body(this, W / 2, 190, 'Überlebe so viele Runden wie möglich.', 18, '#FFFFFF');
    }

    // Leben als Bohnen
    for (let i = 0; i < 4; i++) {
      const alive = i < State.lives, justLost = r && !r.ok && i === State.lives;
      const g = this.add.graphics({ x: W / 2 + (i - 1.5) * 64, y: 296 });
      drawBean(g, 0, 0, 0.85, alive ? NEON_HEX[i] : 0x3A3A5C, alive ? 'happy' : 'dead');
      if (alive) this.tweens.add({ targets: g, scaleY: 1.08, y: 292, duration: 220, yoyo: true, repeat: -1, delay: i * 90 });
      if (justLost) {
        g.clear(); drawBean(g, 0, 0, 0.85, NEON_HEX[i], 'dead');
        this.tweens.add({ targets: g, angle: 90, y: 308, duration: 450, delay: 250, ease: 'Bounce.easeOut' });
        this.tweens.add({ targets: g, alpha: 0.3, duration: 120, yoyo: true, repeat: 3 });
      }
    }
    body(this, W / 2, 320, 'LIVES', 15, '#8A8AB8');

    if (dead) { this.time.delayedCall(1100, () => this.scene.start('GameOver')); return; }

    if (spedUp) {
      const t = big(this, W / 2, 368, 'SPEED UP!', 38, NEON.orange);
      body(this, W / 2, 404, 'Der Prof redet jetzt schneller.', 16, '#FFFFFF');
      this.tweens.add({ targets: t, scale: t.scale * 1.15, duration: 160, yoyo: true, repeat: 3 });
      Sfx.faster();
    }
    const next = nextGameKey();
    this.time.delayedCall(spedUp ? 2000 : (r ? 1350 : 1600), () => this.scene.start(next));
  }
}

class GameOver extends Phaser.Scene {
  constructor() { super('GameOver'); }
  create() {
    this.cameras.main.setBackgroundColor(INK);
    const newBest = State.score > State.best;
    if (newBest) { State.best = State.score; try { localStorage.setItem('dhbw-survival-best', String(State.best)); } catch (e) {} }
    Music.stop();
    Sfx.over();

    stars(this, 40);
    frame(this, 0xFF2E88);
    big(this, W / 2, 70, 'GAME OVER', 64, NEON.pink);
    txt(this, W / 2, 120, 'EXMATRIKULIERT', 22, NEON.cyan);

    // Umgekippte Bohne mit Doktorhut
    const g = this.add.graphics({ x: W / 2, y: 190 });
    drawBean(g, 0, 22, 1.1, 0xFFE600, 'dead');
    g.fillStyle(0x222244).fillRect(-26, -50, 52, 8).fillRect(-14, -58, 28, 10);
    g.lineStyle(3, 0xFFE600).lineBetween(22, -46, 30, -28);
    g.setAngle(-90);

    txt(this, W / 2, 252, 'SCORE  ' + pad(State.score * 100), 20, '#FFFFFF');
    if (newBest) {
      const t = big(this, W / 2, 284, 'NEW HI-SCORE!', 24, NEON.yellow);
      blink(this, t, 250);
    } else {
      txt(this, W / 2, 284, 'HI-SCORE  ' + pad(State.best * 100), 16, NEON.pink);
    }

    // Continue-Countdown: Leertaste startet neu, bei 0 zurück zum Titel
    big(this, W / 2, 336, 'CONTINUE?', 30, NEON.yellow);
    let n = 9;
    const num = big(this, W / 2, 384, String(n), 44, '#FFFFFF');
    body(this, W / 2, 418, 'LEERTASTE', 15, NEON.cyan);
    this.time.addEvent({ delay: 1000, repeat: 9, callback: () => {
      n--;
      if (n < 0) { this.scene.start('Title'); return; }
      num.setText(String(n));
      Sfx.tick();
    } });
    this.time.delayedCall(700, () => {
      this.input.keyboard.once('keydown-SPACE', () => { Sfx.coin(); startRun(this); });
    });
  }
}

// ============================================================
//  Start (wartet kurz auf die Schriften)
// ============================================================
const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H,
  backgroundColor: '#07071A',
  input: { mouse: false, touch: false },   // nur Tastatur
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Title, Transition, GameOver, FensterZu, WlanFangen, Sitzplatz, Fluchttreppe, Speichern, KloFinden]
};

function boot() { if (!window.__dhbwGame) window.__dhbwGame = new Phaser.Game(config); }
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.all([document.fonts.load('40px "Press Start 2P"'), document.fonts.load('20px "VT323"')])
  : Promise.resolve();
Promise.race([fontsReady, new Promise(res => setTimeout(res, 1500))]).then(boot, boot);
</script>
