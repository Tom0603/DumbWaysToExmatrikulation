<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dumb Ways to Exmatrikulation 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Same arcade cabinet look as the 2D version: neon on black, pixel font, scanlines */
  :root {
    --bg: #07071A;
    --pink: #FF2E88;
    --cyan: #00E5FF;
    --yellow: #FFE600;
    --paper: #FFFFFF;
    --muted: #8A8AB8;
    --display: "Press Start 2P", "Courier New", monospace;
    --body: "VT323", "Courier New", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: var(--body);
    font-size: 19px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
  .tag {
    font-family: var(--display);
    font-size: 13px;
    line-height: 1.6;
    color: var(--yellow);
    text-shadow: 0 0 8px var(--pink), 2px 2px 0 var(--pink);
  }
  header p { margin: 0; color: var(--muted); }
  #game {
    flex: 1 1 auto; min-height: 220px; position: relative; overflow: hidden;
    border: 3px solid var(--pink);
    border-radius: 6px;
    box-shadow: 0 0 18px rgba(255, 46, 136, .55), inset 0 0 18px rgba(255, 46, 136, .35);
    background: #000;
  }
  /* CRT tube: scanlines + vignette, click-through */
  #game::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, .28) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, .55) 100%);
  }
  #stage { position: absolute; overflow: hidden; }
  #shaker { position: absolute; inset: 0; }
  #shaker canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: absolute; left: 0; top: 0; width: 800px; height: 450px;
    transform-origin: 0 0; pointer-events: none; overflow: hidden;
  }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .layer { position: absolute; inset: 0; }
  .box { position: absolute; }
  .t { position: absolute; left: 0; top: 0; white-space: pre; text-align: center; line-height: 1.25; transform-origin: 0 0; }
  .t.display { font-family: var(--display); }
  .t.body { font-family: var(--body); line-height: 1; }
  .t.stroked { paint-order: stroke fill; }
  .neon-frame { position: absolute; inset: 8px; border: 3px solid; }
  .fatal { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 24px; color: var(--pink); }
  footer { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
  footer a { color: var(--cyan); }
  kbd {
    font-family: var(--display);
    font-size: 10px;
    color: var(--cyan);
    border: 2px solid var(--cyan);
    padding: 1px 5px;
  }
</style>

<body>
<header>
  <span class="tag">Dumb Ways to Exmatrikulation 3D</span>

</header>
<div id="game"></div>

  <span>Steuerung nur per Tastatur: <kbd>Leertaste</kbd>, <kbd>Pfeiltasten</kbd> · Musik an/aus: <kbd>M</kbd></span>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
// ============================================================
//  DUMB WAYS TO EXMATRIKULATION 3D – three.js port of the 2D game.
//  Game rules, timings and balancing mirror dhbw-survival.html;
//  only the presentation is 3D. Text and UI live in a DOM overlay
//  laid out in the same 800×450 coordinate space as the 2D version.
// ============================================================
import * as THREE from 'three';

const W = 800, H = 450;
const COL = {
  ink: 0x10231A, exit: 0x1E8A4C, paper: 0xF5F7F2, hazard: 0xFFC61A,
  alarm: 0xE2382B, good: 0x3FD07A, slate: 0x24323A, wall: 0xD7DDD3,
  floor: 0xC2B08F, chair: 0x2E5E8C, skin: 0xE8B88E
};
const STUDENT_COLORS = [0xE2382B, 0x7A4FB5, 0x2C9C8F, 0xD9822B, 0x4466CC];
const INK = 0x07071A, INK_S = '#07071A';
const PAPER_S = '#F5F7F2', INK_TEXT = '#10231A';
const NEON = { pink: '#FF2E88', cyan: '#00E5FF', yellow: '#FFE600', green: '#39FF14', purple: '#B24DFF', orange: '#FF8A00' };
const NEON_HEX = [0xFF2E88, 0x00E5FF, 0xFFE600, 0x39FF14, 0xB24DFF, 0xFF8A00];
const GAME_KEYS = ['FensterZu', 'WlanFangen', 'Sitzplatz', 'Fluchttreppe', 'Speichern', 'KloFinden'];
const BEST_SCORE_KEY = 'dhbw-survival-3d-best';
const MAX_FRAME_MS = 50;
const LIVES = 4;

// World scale: floor games map one 2D pixel to WORLD_UNIT. "Flat" screens put the
// camera FLAT_DISTANCE in front of the z = 0 plane so one 2D pixel equals FLAT_UNIT there.
const CAMERA_FOV = 50;
const WORLD_UNIT = 1 / 40;
const FLAT_DISTANCE = 10;
const FLAT_UNIT = 2 * FLAT_DISTANCE * Math.tan(THREE.MathUtils.degToRad(CAMERA_FOV / 2)) / H;
const FLAT_SCALE = FLAT_UNIT / WORLD_UNIT;
const flatX = x => (x - W / 2) * FLAT_UNIT;
const flatY = y => (H / 2 - y) * FLAT_UNIT;
const flatPx = length => length * FLAT_UNIT;
const floorX = x => (x - W / 2) * WORLD_UNIT;
const floorZ = y => (y - H / 2) * WORLD_UNIT;

// ---------- Utilities ----------
const rand = (min, max) => min + Math.random() * (max - min);
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const pick = list => list[Math.floor(Math.random() * list.length)];
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const distance = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const css = hex => '#' + hex.toString(16).padStart(6, '0');
const pad = (n, length = 6) => String(n).padStart(length, '0');
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

const Ease = {
  linear: k => k,
  quadIn: k => k * k,
  quadOut: k => k * (2 - k),
  sineOut: k => Math.sin(k * Math.PI / 2),
  sineInOut: k => -(Math.cos(Math.PI * k) - 1) / 2,
  backOut: k => { const s = 1.70158, t = k - 1; return t * t * ((s + 1) * t + s) + 1; },
  bounceOut: k => {
    if (k < 1 / 2.75) return 7.5625 * k * k;
    if (k < 2 / 2.75) { k -= 1.5 / 2.75; return 7.5625 * k * k + 0.75; }
    if (k < 2.5 / 2.75) { k -= 2.25 / 2.75; return 7.5625 * k * k + 0.9375; }
    k -= 2.625 / 2.75; return 7.5625 * k * k + 0.984375;
  }
};

// ---------- Game state ----------
const State = { lives: LIVES, score: 0, round: 0, speed: 1, result: null, bag: [], last: null, best: 0 };
try { State.best = parseInt(localStorage.getItem(BEST_SCORE_KEY), 10) || 0; } catch (error) { State.best = 0; }

function resetRun() {
  Object.assign(State, { lives: LIVES, score: 0, round: 0, speed: 1, result: null, bag: [], last: null });
}
function nextGameKey() {
  if (!State.bag.length) {
    State.bag = shuffle(GAME_KEYS.slice());
    if (State.bag[0] === State.last) State.bag.push(State.bag.shift());
  }
  State.last = State.bag.shift();
  return State.last;
}
function saveBest() {
  try { localStorage.setItem(BEST_SCORE_KEY, String(State.best)); } catch (error) { /* private mode: hi-score stays session-only */ }
}

// ---------- Sound (WebAudio, no assets) ----------
const Sfx = {
  ctx: null,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (error) { this.ctx = null; }
  },
  tone(freq, dur = 0.1, type = 'square', vol = 0.06, slide = 0) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, gap = 80, dur = 0.11) { notes.forEach((f, i) => setTimeout(() => this.tone(f, dur), i * gap)); },
  win() { this.seq([523, 659, 784, 1046]); },
  lose() { this.tone(320, 0.45, 'sawtooth', 0.07, -240); },
  tick() { this.tone(980, 0.04, 'square', 0.035); },
  blip() { this.tone(660, 0.05, 'square', 0.04); },
  coin() { this.tone(988, 0.08, 'square', 0.06); setTimeout(() => this.tone(1319, 0.35, 'square', 0.06), 80); },
  faster() { this.seq([392, 523, 659, 784, 1046, 1318], 60, 0.08); },
  over() { this.seq([392, 330, 262, 196], 180, 0.25); },
  // Fire: noise with random crackle + rising hiss
  burn(dur = 1.6) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let pop = 0;
    for (let i = 0; i < len; i++) {
      if (Math.random() < 0.0009) pop = 0.6 + Math.random() * 0.4;
      pop *= 0.985;
      d[i] = (Math.random() * 2 - 1) * (0.25 + pop);
    }
    const src = c.createBufferSource(); src.buffer = buf;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2500, t); lp.frequency.exponentialRampToValueAtTime(600, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(lp); lp.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t + dur);
    this.tone(220, 0.5, 'sawtooth', 0.05, 500);
  },
  // Fart: wobbling fundamental + filtered noise, fluttering volume
  fart(dur = 1.1) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, N = 64;
    const pitch = new Float32Array(N), amp = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const k = i / (N - 1);
      pitch[i] = (95 - 40 * k) * (0.8 + Math.random() * 0.4);
      const env = Math.min(1, k * 12) * (1 - Math.pow(k, 3));
      amp[i] = env * (i % 2 ? 0.35 + Math.random() * 0.3 : 1) * 0.22;
    }
    amp[N - 1] = 0;

    const o = c.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueCurveAtTime(pitch, t, dur);

    const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource(); noise.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 180; bp.Q.value = 0.8;
    const ng = c.createGain(); ng.gain.value = 0.6;

    const shaper = c.createWaveShaper(), curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 4); }
    shaper.curve = curve;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(250, t + dur);
    const g = c.createGain(); g.gain.setValueCurveAtTime(amp, t, dur);

    o.connect(shaper); noise.connect(bp); bp.connect(ng); ng.connect(shaper);
    shaper.connect(lp); lp.connect(g); g.connect(c.destination);
    o.start(t); noise.start(t); o.stop(t + dur + 0.05); noise.stop(t + dur + 0.05);
  }
};

// ---------- Music: upbeat chiptune loop, tempo follows State.speed ----------
const Music = {
  on: false, muted: false, bpm: 128, step: 0, next: 0, timer: null, out: null, noise: null,
  // 4 bars of 16 sixteenths, MIDI notes, 0 = rest
  MEL: [
    76, 0, 79, 0, 84, 0, 79, 0, 81, 79, 76, 0, 74, 0, 76, 0,
    72, 0, 76, 0, 81, 0, 76, 0, 79, 0, 76, 0, 74, 72, 0, 0,
    77, 0, 81, 0, 84, 0, 81, 0, 79, 0, 77, 0, 76, 0, 74, 0,
    79, 0, 0, 79, 81, 0, 79, 0, 77, 0, 76, 0, 74, 0, 71, 0
  ],
  CH: [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]],   // C – Am – F – G
  mtof(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  start(speed = 1) {
    const c = Sfx.ctx; if (!c) return;
    if (!this.out) {
      this.out = c.createGain(); this.out.connect(c.destination);
      const len = c.sampleRate * 0.2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    this.out.gain.value = this.muted ? 0 : 0.5;
    this.setSpeed(speed);
    if (this.on) return;
    this.on = true; this.step = 0; this.next = c.currentTime + 0.05;
    this.timer = setInterval(() => this.pump(), 25);
  },
  stop() { this.on = false; clearInterval(this.timer); },
  setSpeed(s) { this.bpm = 128 * s; },
  toggleMute() { this.muted = !this.muted; if (this.out) this.out.gain.value = this.muted ? 0 : 0.5; },
  pump() {
    const c = Sfx.ctx;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime;   // tab was in the background
    while (this.next < c.currentTime + 0.12) {
      this.play(this.step % 64, this.next);
      this.next += 60 / this.bpm / 4;
      this.step++;
    }
  },
  play(i, t) {
    const s = i & 15, ch = this.CH[i >> 4], beat = 60 / this.bpm;
    if (this.MEL[i]) this.voice(t, this.mtof(this.MEL[i]), beat * 0.45, 'square', 0.07);
    if (s % 4 === 0) this.voice(t, this.mtof(ch[0] - 12 + (s % 8 ? 12 : 0)), beat * 0.4, 'triangle', 0.22);   // bass
    if (s % 2 === 1) this.voice(t, this.mtof(ch[(i >> 1) % 3] + 24), beat * 0.12, 'square', 0.025);       // arpeggio
    if (s % 8 === 0) this.kick(t);
    if (s % 8 === 4) this.hit(t, 0.12, 1500, 0.22);   // snare
    if (s % 2 === 1) this.hit(t, 0.03, 7000, 0.06);   // hi-hat
  },
  voice(t, f, d, type, v) {
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + d + 0.02);
  },
  kick(t) {
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + 0.17);
  },
  hit(t, d, hp, v) {
    const c = Sfx.ctx, n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = this.noise; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    n.connect(f); f.connect(g); g.connect(this.out);
    n.start(t); n.stop(t + d + 0.01);
  }
};

// ---------- Keyboard ----------
const CAPTURED_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
const ANY_KEY = '*';
const pressedKeys = new Set();
const isDown = code => pressedKeys.has(code);

window.addEventListener('keydown', event => {
  if (CAPTURED_KEYS.has(event.code)) event.preventDefault();
  pressedKeys.add(event.code);
  if (event.code === 'KeyM' && !event.repeat) Music.toggleMute();
  if (Game.screen) Game.screen.handleKey(event);
});
window.addEventListener('keyup', event => pressedKeys.delete(event.code));
window.addEventListener('blur', () => pressedKeys.clear());

// ---------- Stage: WebGL canvas + 800×450 HUD overlay, letterboxed into #game ----------
const gameElement = document.getElementById('game');
const stage = document.createElement('div'); stage.id = 'stage';
const shaker = document.createElement('div'); shaker.id = 'shaker';
const hudRoot = document.createElement('div'); hudRoot.id = 'hud';
const flashElement = document.createElement('div'); flashElement.id = 'flash';
let renderer = null;
let stageScale = 1;

function createRenderer() {
  const instance = new THREE.WebGLRenderer({ antialias: true });
  instance.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  instance.shadowMap.enabled = true;
  instance.shadowMap.type = THREE.PCFSoftShadowMap;
  return instance;
}

function fitStage() {
  const width = gameElement.clientWidth, height = gameElement.clientHeight;
  stageScale = Math.min(width / W, height / H);
  const stageWidth = Math.floor(W * stageScale), stageHeight = Math.floor(H * stageScale);
  Object.assign(stage.style, {
    width: stageWidth + 'px', height: stageHeight + 'px',
    left: Math.floor((width - stageWidth) / 2) + 'px', top: Math.floor((height - stageHeight) / 2) + 'px'
  });
  renderer.setSize(stageWidth, stageHeight, false);
  hudRoot.style.transform = `scale(${stageScale})`;
}

const Effects = {
  shakeUntil: 0, shakeIntensity: 0,
  flash(duration, red, green, blue) {
    flashElement.style.background = `rgb(${red}, ${green}, ${blue})`;
    flashElement.animate([{ opacity: 0.8 }, { opacity: 0 }], { duration, easing: 'ease-out' });
  },
  shake(duration, intensity) {
    this.shakeUntil = performance.now() + duration;
    this.shakeIntensity = intensity;
  },
  apply(now) {
    if (now >= this.shakeUntil) { shaker.style.transform = ''; return; }
    const magnitude = this.shakeIntensity * W * stageScale;
    shaker.style.transform = `translate(${rand(-magnitude, magnitude)}px, ${rand(-magnitude, magnitude)}px)`;
  },
  reset() {
    this.shakeUntil = 0;
    shaker.style.transform = '';
    flashElement.getAnimations().forEach(animation => animation.cancel());
  }
};

// ---------- HUD text ----------
const FONT_SCALE = { display: 0.72, body: 1.35 };   // pixel font is wide: same size mapping as the 2D helpers

class HudItem {
  constructor(element, x, y, origin = [0.5, 0.5]) {
    this.element = element;
    this.origin = origin;
    this._x = x; this._y = y; this._scale = 1; this._alpha = 1;
    this.destroyed = false;
    this.apply();
  }
  get x() { return this._x; } set x(value) { this._x = value; this.apply(); }
  get y() { return this._y; } set y(value) { this._y = value; this.apply(); }
  get scale() { return this._scale; } set scale(value) { this._scale = value; this.apply(); }
  get alpha() { return this._alpha; } set alpha(value) { this._alpha = value; this.element.style.opacity = value; }
  get visible() { return this.element.style.visibility !== 'hidden'; }
  apply() {
    const [originX, originY] = this.origin;
    this.element.style.transform =
      `translate(${this._x}px, ${this._y}px) scale(${this._scale}) translate(${-originX * 100}%, ${-originY * 100}%)`;
  }
  setText(text) { this.element.textContent = text; return this; }
  setColor(color) { this.element.style.color = color; return this; }
  setBackground(color) { this.element.style.background = color; return this; }
  setVisible(visible) { this.element.style.visibility = visible ? 'visible' : 'hidden'; return this; }
  destroy() { this.destroyed = true; this.element.remove(); }
}

// ---------- three.js building blocks ----------
function standardMaterial(color, options = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...options });
}
function basicMaterial(color, options = {}) {
  return new THREE.MeshBasicMaterial({ color, ...options });
}
function mesh(geometry, material, { cast = true, receive = true } = {}) {
  const result = new THREE.Mesh(geometry, material);
  result.castShadow = cast;
  result.receiveShadow = receive;
  return result;
}
function at(object, x, y, z) { object.position.set(x, y, z); return object; }
function box(width, height, depth, color, options) {
  return mesh(new THREE.BoxGeometry(width, height, depth), standardMaterial(color, options));
}
// Axis-aligned box spanning the given world-space ranges
function boxBetween(x0, x1, y0, y1, z0, z1, color, options) {
  return at(box(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0), color, options), (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
}
function sphere(radius, color, options) {
  return mesh(new THREE.SphereGeometry(radius, 16, 12), standardMaterial(color, options));
}
function cylinder(radius, height, color, options, segments = 20) {
  return mesh(new THREE.CylinderGeometry(radius, radius, height, segments), standardMaterial(color, options));
}
function eachMaterial(object, callback) {
  object.traverse(child => {
    if (!child.material) return;
    (Array.isArray(child.material) ? child.material : [child.material]).forEach(callback);
  });
}
function setOpacity(object, opacity) {
  eachMaterial(object, material => {
    if (!material.transparent) { material.transparent = true; material.needsUpdate = true; }
    material.opacity = opacity;
  });
}
function disposeTree(root) {
  root.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.isLight && child.dispose) child.dispose();
  });
  eachMaterial(root, material => {
    if (material.map) material.map.dispose();
    material.dispose();
  });
}
function addLights(scene, { sky = 0xFFFFFF, ground = 0x445566, hemi = 1.6, sun = 2.2, sunPos = [5, 12, 8], shadow = 12 } = {}) {
  const hemiLight = new THREE.HemisphereLight(sky, ground, hemi);
  const sunLight = new THREE.DirectionalLight(0xFFFFFF, sun);
  sunLight.position.set(...sunPos);
  if (shadow) {
    sunLight.castShadow = true;
    const shadowCamera = sunLight.shadow.camera;
    Object.assign(shadowCamera, { left: -shadow, right: shadow, top: shadow, bottom: -shadow, near: 0.5, far: 80 });
    sunLight.shadow.mapSize.set(1024, 1024);
    sunLight.shadow.bias = -0.0008;
  }
  scene.add(hemiLight, sunLight);
  return { hemi: hemiLight, sun: sunLight };
}

// Bean with a face; origin = middle of the feet, face looks along +z. mood: happy | worried | dead
const BEAN_RADIUS = 0.425, BEAN_HEIGHT = 1.45;
function makeBean(color, mood = 'happy', scale = 1, { glow = 0 } = {}) {
  const group = new THREE.Group();
  const bodyMaterial = standardMaterial(color, { roughness: 0.5, emissive: color, emissiveIntensity: glow });
  const body = mesh(new THREE.CapsuleGeometry(BEAN_RADIUS, BEAN_HEIGHT - 2 * BEAN_RADIUS, 6, 18), bodyMaterial);
  body.position.y = BEAN_HEIGHT / 2;
  const face = new THREE.Group();
  face.position.set(0, BEAN_HEIGHT * 0.7, BEAN_RADIUS * 0.94);
  const eyes = new THREE.Group(), mouth = new THREE.Group();
  face.add(eyes, mouth);
  const eyeOffset = 0.175, mouthY = -BEAN_HEIGHT * 0.2;

  if (mood === 'dead') {
    for (const side of [-1, 1]) {
      for (const tilt of [-1, 1]) {
        const stroke = box(0.24, 0.055, 0.05, INK);
        stroke.rotation.z = tilt * Math.PI / 4;
        eyes.add(at(stroke, side * eyeOffset, 0, 0.02));
      }
    }
    mouth.add(at(box(0.25, 0.055, 0.05, INK), 0, -BEAN_HEIGHT * 0.25, 0));
  } else {
    for (const side of [-1, 1]) {
      eyes.add(at(sphere(0.15, 0xFFFFFF, { roughness: 0.3 }), side * eyeOffset, 0, 0));
      eyes.add(at(sphere(0.075, INK, { roughness: 0.3 }), side * eyeOffset + 0.025, -0.025, 0.11));
    }
    if (mood === 'happy') {
      const smile = mesh(new THREE.TorusGeometry(0.15, 0.035, 8, 16, Math.PI * 0.85), standardMaterial(INK));
      smile.rotation.z = Math.PI + Math.PI * 0.075;
      mouth.add(at(smile, 0, mouthY + 0.03, -0.02));
    } else {
      const gasp = sphere(0.1, INK);
      gasp.scale.set(0.75, 1, 0.5);
      mouth.add(at(gasp, 0, -BEAN_HEIGHT * 0.28, 0));
    }
  }
  group.add(body, face);
  group.scale.setScalar(scale);
  group.userData = { body, face, eyes, mouth, baseScale: scale };
  return group;
}

// ============================================================
//  Screen: one three.js scene + HUD layer + own timers, tweens, keys
// ============================================================
class Screen {
  constructor() {
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(CAMERA_FOV, W / H, 0.1, 300);
    this.hud = document.createElement('div');
    this.hud.className = 'layer';
    this.clock = 0;
    this.tweens = [];
    this.timers = [];
    this.keyHandlers = [];
    this.anchored = [];
    this.particles = [];
    this.frameCallbacks = [];
  }
  enter() { hudRoot.append(this.hud); this.create(); }
  exit() { this.hud.remove(); disposeTree(this.scene); }
  create() {}
  update(delta) {}

  tick(delta) {
    this.clock += delta;
    this.runTimers();
    this.runTweens(delta);
    this.update(delta);
    const dt = Math.min(delta, MAX_FRAME_MS) / 1000;
    this.frameCallbacks.forEach(callback => callback(dt));
    this.runParticles(dt);
  }
  render() {
    renderer.render(this.scene, this.camera);
    this.placeAnchored();
  }
  onFrame(callback) { this.frameCallbacks.push(callback); }

  // --- timers ---
  after(ms, callback) { this.timers.push({ at: this.clock + ms, callback }); }
  repeatEvery(ms, count, callback, firstDelay = ms) {
    let fired = 0;
    const fire = () => { callback(fired); if (++fired < count) this.after(ms, fire); };
    this.after(firstDelay, fire);
  }
  clearTimers() { this.timers = []; }
  runTimers() {
    const due = this.timers.filter(timer => timer.at <= this.clock);
    this.timers = this.timers.filter(timer => timer.at > this.clock);
    due.forEach(timer => timer.callback());
  }

  // --- tweens (numeric properties; repeat -1 = forever) ---
  tween(target, props, { duration = 300, delay = 0, ease = Ease.linear, yoyo = false, repeat = 0, hold = 0, repeatDelay = 0, onUpdate, onComplete } = {}) {
    const tween = { target, props, from: null, duration: Math.max(1, duration), delay, ease, yoyo, repeat, hold, repeatDelay, onUpdate, onComplete, elapsed: 0, done: false };
    this.tweens.push(tween);
    return tween;
  }
  runTweens(delta) {
    for (const tween of this.tweens) {
      if (tween.done) continue;
      tween.elapsed += delta;
      if (tween.elapsed < tween.delay) continue;
      if (!tween.from) {
        tween.from = {};
        for (const key in tween.props) tween.from[key] = tween.target[key];
      }
      const forward = tween.duration;
      const cycle = forward * (tween.yoyo ? 2 : 1) + tween.hold + tween.repeatDelay;
      let local = tween.elapsed - tween.delay;
      const loop = Math.floor(local / cycle);
      const finished = tween.repeat >= 0 && loop > tween.repeat;
      local -= loop * cycle;
      let progress;
      if (finished) progress = tween.yoyo ? 0 : 1;
      else if (local < forward) progress = tween.ease(local / forward);
      else if (local < forward + tween.hold) progress = 1;
      else if (tween.yoyo && local < 2 * forward + tween.hold) progress = tween.ease(1 - (local - forward - tween.hold) / forward);
      else progress = tween.yoyo ? 0 : 1;
      for (const key in tween.props) tween.target[key] = tween.from[key] + (tween.props[key] - tween.from[key]) * progress;
      if (tween.onUpdate) tween.onUpdate(tween.target);
      if (finished) {
        tween.done = true;
        if (tween.onComplete) tween.onComplete();
      }
    }
    this.tweens = this.tweens.filter(tween => !tween.done);
  }
  // Tweens an object's material opacity (Phaser-style alpha for 3D objects)
  fade(object, to, options = {}) {
    const state = { opacity: object.userData.opacity ?? 1 };
    return this.tween(state, { opacity: to }, {
      ...options,
      onUpdate: () => { object.userData.opacity = state.opacity; setOpacity(object, state.opacity); }
    });
  }

  // --- particles: fly, grow, spin and fade out, then get disposed ---
  spawn(object, { velocity = new THREE.Vector3(), life = 1, grow = 0, spin = 0, gravity = 0, opacity = 1 } = {}) {
    this.scene.add(object);
    this.particles.push({ object, velocity, life, grow, spin, gravity, opacity, age: 0, baseScale: object.scale.x });
  }
  runParticles(dt) {
    this.particles = this.particles.filter(particle => {
      particle.age += dt;
      const progress = particle.age / particle.life;
      if (progress >= 1) {
        this.scene.remove(particle.object);
        disposeTree(particle.object);
        return false;
      }
      particle.velocity.y -= particle.gravity * dt;
      particle.object.position.addScaledVector(particle.velocity, dt);
      particle.object.scale.setScalar(particle.baseScale * (1 + particle.grow * progress));
      particle.object.rotation.z += particle.spin * dt;
      setOpacity(particle.object, particle.opacity * (1 - progress));
      return true;
    });
  }

  // --- keys ---
  onKey(code, handler, { repeat = false, once = false } = {}) {
    this.keyHandlers.push({ code, handler, repeat, once });
  }
  handleKey(event) {
    for (const binding of this.keyHandlers.slice()) {
      if (binding.code !== ANY_KEY && binding.code !== event.code) continue;
      if (event.repeat && !binding.repeat) continue;
      if (binding.once) this.keyHandlers.splice(this.keyHandlers.indexOf(binding), 1);
      binding.handler(event);
    }
  }

  // --- HUD ---
  element(styles, parent = this.hud) {
    const element = document.createElement('div');
    element.className = 'box';
    for (const [key, value] of Object.entries(styles)) element.style[key] = typeof value === 'number' ? value + 'px' : value;
    parent.append(element);
    return element;
  }
  addText(x, y, text, size, color, font, { origin, stroke, background, padding, fontPx, border } = {}) {
    const element = document.createElement('div');
    element.className = `t ${font}`;
    element.textContent = text;
    element.style.fontSize = (fontPx ?? Math.round(size * FONT_SCALE[font])) + 'px';
    element.style.color = color;
    if (stroke) {
      const [width, strokeColor] = stroke;
      element.classList.add('stroked');
      element.style.webkitTextStroke = `${width}px ${strokeColor}`;
    }
    if (background) element.style.background = background;
    if (padding) element.style.padding = padding;
    if (border) element.style.border = border;
    this.hud.append(element);
    return new HudItem(element, x, y, origin);
  }
  txt(x, y, text, size, color = PAPER_S, options) { return this.addText(x, y, text, size, color, 'display', options); }
  body(x, y, text, size, color = PAPER_S, options) { return this.addText(x, y, text, size, color, 'body', options); }
  // Neon sign text: black outline + glow, shrinks to fit the screen width
  big(x, y, text, size, color = '#FFFFFF') {
    const item = this.txt(x, y, text, size, color, { stroke: [Math.max(5, size / 8), INK_S] });
    item.element.style.textShadow = `0 0 14px ${color}`;
    const width = item.element.offsetWidth;
    if (width > W - 40) item.scale = (W - 40) / width;
    return item;
  }
  blink(item, ms = 480) { this.repeatEvery(ms, Infinity, () => item.setVisible(!item.visible)); }
  frame(color) {
    const neon = css(color);
    this.element({ inset: '8px', border: `3px solid ${neon}`, boxShadow: `0 0 10px ${neon}, inset 0 0 10px ${neon}` });
  }
  // Keeps a HUD item glued to a 3D object (offset in world units)
  anchor(item, object, offset = new THREE.Vector3(), maxDistance = Infinity) {
    this.anchored.push({ item, object, offset, maxDistance });
    return item;
  }
  placeAnchored() {
    const point = new THREE.Vector3();
    this.anchored = this.anchored.filter(entry => !entry.item.destroyed);
    for (const { item, object, offset, maxDistance } of this.anchored) {
      object.getWorldPosition(point).add(offset);
      const inRange = point.distanceTo(this.camera.position) <= maxDistance;
      point.project(this.camera);
      item.element.style.display = inRange && point.z < 1 ? '' : 'none';
      item.x = (point.x + 1) / 2 * W;
      item.y = (1 - point.y) / 2 * H;
    }
  }

  // Slowly falling starfield in front of a flat screen's backdrop
  addStarfield(count) {
    const positions = new Float32Array(count * 3), colors = new Float32Array(count * 3), speeds = [];
    const halfWidth = 11, halfHeight = 6.5;
    for (let i = 0; i < count; i++) {
      const speed = 15 + Math.random() * 70, brightness = 0.25 + speed / 120;
      positions.set([rand(-halfWidth, halfWidth), rand(-halfHeight, halfHeight), rand(-4, -1)], i * 3);
      colors.set([brightness, brightness, brightness], i * 3);
      speeds.push(speed * FLAT_UNIT);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const stars = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.07, vertexColors: true }));
    this.scene.add(stars);
    this.onFrame(dt => {
      for (let i = 0; i < count; i++) {
        positions[i * 3 + 1] -= speeds[i] * dt;
        if (positions[i * 3 + 1] < -halfHeight) {
          positions[i * 3 + 1] = halfHeight;
          positions[i * 3] = rand(-halfWidth, halfWidth);
        }
      }
      geometry.attributes.position.needsUpdate = true;
    });
  }
  useFlatCamera() {
    this.camera.position.set(0, 0, FLAT_DISTANCE);
    this.camera.lookAt(0, 0, 0);
  }
  setFov(fov) {
    this.camera.fov = fov;
    this.camera.updateProjectionMatrix();
  }
}

// ============================================================
//  Base class for all minigames
// ============================================================
class MicroGame extends Screen {
  // meta: { title, hint, duration (ms), bg, survive (outlasting the timer = win), timeoutMsg, winMsg }
  constructor(meta) { super(); this.meta = meta; }

  create() {
    this.done = false;
    this.spd = State.speed;
    this.total = this.meta.duration / this.spd;
    this.left = this.total;
    this.lastSec = 99;
    this.scene.background = new THREE.Color(this.meta.bg);

    this.setup();

    // Fuse at the bottom
    const track = this.element({ left: 0, top: H - 12, width: W, height: 12, background: INK_S });
    this.fuse = this.element({ inset: 0, background: NEON.green, transformOrigin: '0 0' }, track);
    this.body(W / 2, H - 16, this.meta.hint, 0, NEON.cyan, { origin: [0.5, 1], fontPx: 22, background: INK_S, padding: '2px 10px' });

    // Big announcement
    const title = this.big(W / 2, H / 2 - 20, this.meta.title, 66, NEON.yellow);
    const baseScale = title.scale;
    title.scale = baseScale * 2;
    this.tween(title, { scale: baseScale }, { duration: 220, ease: Ease.backOut });
    this.tween(title, { alpha: 0, y: title.y - 40 }, { delay: 620, duration: 240, ease: Ease.quadIn });
  }

  update(delta) {
    const dt = Math.min(delta, MAX_FRAME_MS) / 1000;
    if (!this.done) {
      this.left -= delta;
      const fraction = Math.max(0, this.left / this.total);
      this.fuse.style.transform = `scaleX(${fraction})`;
      if (this.left < 1000) this.fuse.style.background = css(COL.alarm);
      const sec = Math.ceil(this.left / 1000);
      if (sec <= 3 && sec < this.lastSec && sec > 0) { this.lastSec = sec; Sfx.tick(); }

      this.step(dt);

      if (!this.done && this.left <= 0) {
        if (this.meta.survive) this.win(this.meta.winMsg || 'Überlebt!');
        else this.lose(this.meta.timeoutMsg || 'Zu langsam!');
      }
    }
    this.animate(dt);
  }

  win(msg) {
    if (this.done) return;
    this.done = true;
    State.result = { ok: true, msg };
    Sfx.win();
    if (this.onWin) this.onWin();
    Effects.flash(180, 63, 208, 122);
    this.after(750, () => Game.start('Transition'));
  }

  lose(msg) {
    if (this.done) return;
    this.done = true;
    State.result = { ok: false, msg };
    Sfx.lose();
    if (this.onLose) this.onLose();
    Effects.shake(260, 0.012);
    this.after(this.loseDelay || 750, () => Game.start('Transition'));
  }

  onAction(callback) { this.onKey('Space', callback); }

  setup() {}
  step(dt) {}
  animate(dt) {}   // runs every frame, also after the round is decided
}

// ============================================================
//  1) FENSTER ZU! – timing
// ============================================================
const WINDOW_OPEN_ANGLE = 1.25;
const WINDOW_FRAME = 10;

class FensterZu extends MicroGame {
  constructor() {
    super({ title: 'FENSTER ZU!', hint: 'Leertaste, wenn es GENAU zu ist', duration: 4200, bg: COL.wall, timeoutMsg: 'Zu lange gezögert. Es zieht.' });
  }
  setup() {
    this.p = 0; this.dir = 1; this.locked = false;
    this.zone = [0.86, 0.94];
    this.useFlatCamera();
    addLights(this.scene, { sunPos: [-3, 5, 9], shadow: 9 });

    const hole = { left: flatX(150), right: flatX(420), top: flatY(60), bottom: flatY(310) };
    this.buildWall(hole);
    this.buildOutside(hole);
    this.buildSash(hole);
    this.buildRadiator();
    this.buildVent();
    this.buildMeter();

    this.onAction(() => this.press());
    this.drawWindow();
  }
  buildWall(hole) {
    const extent = 14, depth = 0.5;
    this.scene.add(
      boxBetween(-extent, hole.left, -extent, extent, -depth, 0, COL.wall),
      boxBetween(hole.right, extent, -extent, extent, -depth, 0, COL.wall),
      boxBetween(hole.left, hole.right, hole.top, extent, -depth, 0, COL.wall),
      boxBetween(hole.left, hole.right, -extent, hole.bottom, -depth, 0, COL.wall));
    const half = flatPx(WINDOW_FRAME) / 2, frameColor = 0x5B6B60;
    this.scene.add(
      boxBetween(hole.left - half, hole.right + half, hole.top - half, hole.top + half, -depth, 0.06, frameColor),
      boxBetween(hole.left - half, hole.right + half, hole.bottom - half, hole.bottom + half, -depth, 0.06, frameColor),
      boxBetween(hole.left - half, hole.left + half, hole.bottom, hole.top, -depth, 0.06, frameColor),
      boxBetween(hole.right - half, hole.right + half, hole.bottom, hole.top, -depth, 0.06, frameColor));
    // Window sill
    this.scene.add(boxBetween(flatX(134), flatX(436), flatY(322), flatY(310), -depth, 0.5, 0x9AA396));
  }
  buildOutside(hole) {
    const sky = new THREE.Mesh(new THREE.PlaneGeometry(hole.right - hole.left + 3, hole.top - hole.bottom + 3), basicMaterial(0x8EC6E6));
    at(sky, (hole.left + hole.right) / 2, (hole.top + hole.bottom) / 2, -3);
    this.scene.add(sky);
    for (const [dx, dy, radius] of [[-30, 60, 16], [-50, 66, 13], [-14, 70, 11]]) {
      const cloud = new THREE.Mesh(new THREE.SphereGeometry(flatPx(radius) * 1.4, 16, 12), basicMaterial(0xFFFFFF, { transparent: true, opacity: 0.85 }));
      cloud.scale.set(1.3, 0.8, 0.4);
      this.scene.add(at(cloud, hole.right + flatPx(dx) * 1.3, hole.top - flatPx(dy), -2.8));
    }
    // Draft: streaks of air blowing in through the gap
    this.draft = [];
    for (let i = 0; i < 3; i++) {
      const streak = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.035, 0.035), basicMaterial(0xFFFFFF, { transparent: true, opacity: 0 }));
      streak.rotation.z = 0.15;
      this.scene.add(streak);
      this.draft.push({ mesh: streak, y: flatY(60 + 70 + i * 50), phase: i / 3 });
    }
    this.hole = hole;
  }
  buildSash(hole) {
    const inset = flatPx(WINDOW_FRAME) / 2, bar = flatPx(WINDOW_FRAME);
    const width = hole.right - hole.left - 2 * inset, height = hole.top - hole.bottom - 2 * inset;
    this.sash = at(new THREE.Group(), hole.left + inset, (hole.top + hole.bottom) / 2, -0.22);
    const top = height / 2, bottom = -height / 2;
    this.sash.add(
      boxBetween(0, width, top - bar, top, -0.05, 0.05, COL.paper),
      boxBetween(0, width, bottom, bottom + bar, -0.05, 0.05, COL.paper),
      boxBetween(0, bar, bottom, top, -0.05, 0.05, COL.paper),
      boxBetween(width - bar, width, bottom, top, -0.05, 0.05, COL.paper));
    const glass = mesh(new THREE.PlaneGeometry(width - 2 * bar, height - 2 * bar),
      standardMaterial(0xCDE9F3, { transparent: true, opacity: 0.45, roughness: 0.1, side: THREE.DoubleSide }), { cast: false });
    this.sash.add(at(glass, width / 2, 0, 0));
    this.sash.add(boxBetween(width - flatPx(26), width - flatPx(18), -flatPx(20), flatPx(20), 0.05, 0.14, COL.ink));
    this.scene.add(this.sash);
  }
  buildRadiator() {
    this.scene.add(boxBetween(flatX(165), flatX(405), flatY(352), flatY(330), 0, 0.3, 0xBFC7BC));
    for (let x = 175; x < 400; x += 14) {
      this.scene.add(boxBetween(flatX(x) - 0.02, flatX(x) + 0.02, flatY(350), flatY(332), 0.3, 0.34, 0x9AA396));
    }
  }
  buildVent() {
    const left = flatX(560), right = flatX(710), top = flatY(70), bottom = flatY(220), border = flatPx(2.5);
    this.scene.add(boxBetween(left - border, right + border, bottom - border, top + border, 0, 0.3, COL.ink));
    this.scene.add(boxBetween(left + border, right - border, bottom + border, top - border, 0, 0.34, 0xB8C1B6));
    const centerX = flatX(635), centerY = flatY(145);
    const duct = cylinder(flatPx(62), 0.04, 0x56625A, {}, 40);
    duct.rotation.x = Math.PI / 2;
    this.scene.add(at(duct, centerX, centerY, 0.36));

    this.fan = at(new THREE.Group(), centerX, centerY, 0.45);
    for (let i = 0; i < 3; i++) {
      const holder = new THREE.Group();
      holder.rotation.z = i * Math.PI * 2 / 3;
      const blade = box(flatPx(56), flatPx(20), 0.04, 0xD7DDD3);
      blade.position.x = flatPx(30);
      blade.rotation.x = 0.4;
      holder.add(blade);
      this.fan.add(holder);
    }
    const hub = cylinder(flatPx(9), 0.12, COL.ink);
    hub.rotation.x = Math.PI / 2;
    this.fan.add(hub);
    this.scene.add(this.fan);
    this.fanTxt = this.txt(635, 245, 'LÜFTUNG: AUS', 18, '#E2382B');
  }
  buildMeter() {
    const m = this.m = { x: 150, y: 372, w: 500, h: 24 };
    this.element({ left: m.x - 4, top: m.y - 4, width: m.w + 8, height: m.h + 8, background: css(COL.ink) });
    const segment = (from, to, color) => this.element({ left: m.x + m.w * from, top: m.y, width: m.w * (to - from), height: m.h, background: css(color) });
    segment(0, 1, 0x7D8A80);
    segment(this.zone[0], this.zone[1], COL.good);
    segment(this.zone[1], 1, COL.alarm);
    this.body(m.x + 20, m.y - 14, 'offen', 13, INK_TEXT);
    this.body(m.x + m.w * 0.9, m.y - 14, '100 % ZU', 13, INK_TEXT);
    this.body(m.x + m.w + 8, m.y - 14, 'zu fest', 13, '#E2382B');
    this.marker = this.element({ left: m.x - 4, top: m.y - 9, width: 8, height: m.h + 18, background: css(COL.ink) });
  }
  drawWindow() {
    this.sash.rotation.y = -(1 - this.p) * WINDOW_OPEN_ANGLE;
    this.marker.style.left = (this.m.x + this.m.w * this.p - 4) + 'px';
  }
  step(dt) {
    if (this.locked) return;
    this.p += this.dir * dt / (0.95 / this.spd);
    if (this.p >= 1) { this.p = 1; this.dir = -1; }
    if (this.p <= 0) { this.p = 0; this.dir = 1; }
    this.drawWindow();
  }
  animate(dt) {
    const gap = (1 - this.p) * 90, strength = clamp((gap - 8) / 40, 0, 1);
    for (const streak of this.draft) {
      const progress = (this.clock / 650 + streak.phase) % 1;
      at(streak.mesh, this.hole.right - 0.3 - progress * 1.4, streak.y - progress * 0.25, -1.2 + progress * 3.5);
      streak.mesh.material.opacity = Math.sin(progress * Math.PI) * 0.9 * strength;
    }
  }
  press() {
    if (this.locked || this.done) return;
    this.locked = true;
    if (this.p >= this.zone[0] && this.p <= this.zone[1]) {
      this.p = 1; this.drawWindow();
      this.fanTxt.setText('LÜFTUNG: AN').setColor(css(COL.exit));
      this.tween(this.fan.rotation, { z: this.fan.rotation.z - Math.PI * 8 }, { duration: 1100, ease: Ease.quadIn });
      this.win('Lüftung läuft. Zum ersten Mal seit Jahren.');
    } else {
      const msg = this.p > this.zone[1] ? 'Zu fest gedrückt. Fenster springt wieder auf.' : 'Nicht ganz zu. Lüftung bleibt aus.';
      this.tween(this, { p: 0 }, { duration: 260, ease: Ease.backOut, onUpdate: () => this.drawWindow() });
      this.lose(msg);
    }
  }
}

function makeLaptop({ width = 1.3, depth = 0.9, lidAngle = 0.35, screenColor = 0x6B7A82 } = {}) {
  const group = new THREE.Group();
  group.add(boxBetween(-width / 2, width / 2, 0, 0.06, -depth / 2, depth / 2, 0x1A1A1A));
  group.add(boxBetween(-width / 2 + 0.08, width / 2 - 0.08, 0.06, 0.075, -depth / 2 + 0.08, 0.1, 0x9BA4A8));
  const lid = at(new THREE.Group(), 0, 0.06, -depth / 2);
  lid.rotation.x = -lidAngle;
  lid.add(boxBetween(-width / 2, width / 2, 0, depth, -0.05, 0, 0x1A1A1A));
  const screenMaterial = basicMaterial(screenColor);
  lid.add(at(mesh(new THREE.PlaneGeometry(width - 0.12, depth - 0.12), screenMaterial, { cast: false }), 0, depth / 2, 0.003));
  group.add(lid);
  return { group, screenMaterial };
}

class WlanFangen extends MicroGame {
  constructor() {
    super({ title: 'WLAN FANGEN!', hint: 'Pfeiltasten: Laptop ins Signal halten, bis der Upload durch ist', duration: 5200, bg: COL.slate, timeoutMsg: 'Upload abgebrochen. eduroam halt.' });
  }
  setup() {
    this.setFov(28);
    this.camera.position.set(0, 18, 12.5);
    this.camera.lookAt(0, 0, 0.6);
    addLights(this.scene, { sunPos: [4, 14, 6], shadow: 13 });

    const floor = mesh(new THREE.PlaneGeometry(40, 30), standardMaterial(COL.slate), { cast: false });
    floor.rotation.x = -Math.PI / 2;
    this.scene.add(floor);
    for (let y = 140; y < 420; y += 60) {   // rows of seats
      this.scene.add(boxBetween(floorX(30), floorX(770), 0, 0.35, floorZ(y) - 0.2, floorZ(y) + 0.2, 0x2E3F48));
    }

    this.r = Math.max(62, 88 - (this.spd - 1) * 40);
    this.sig = { x: W * 0.65, y: H * 0.55, vx: 0, vy: 0, on: true };
    this.retarget = 0;
    this.blink = 1.8 + Math.random() * 0.8;
    this.signal = this.buildSignal();

    this.lap = { x: 190, y: 300 };
    this.tgt = { x: 190, y: 300 };
    this.laptop = makeLaptop();
    this.scene.add(this.laptop.group);

    // Upload window
    this.element({ left: 150, top: 22, width: 500, height: 62, background: css(COL.ink), borderRadius: '6px' });
    this.element({ left: 166, top: 62, width: 468, height: 10, background: '#3A4A52' });
    this.up = this.element({ left: 166, top: 62, width: 468, height: 10, background: css(COL.good), transformOrigin: '0 0', transform: 'scaleX(0)' });
    this.body(166, 32, 'abgabe_final_v3_WIRKLICH_final.zip', 0, PAPER_S, { origin: [0, 0], fontPx: 19 });
    this.status = this.body(634, 33, '', 0, '#E2382B', { origin: [1, 0], fontPx: 18 });
    this.prog = 0;
    this.need = 1.8 / this.spd;

    this.drawAll(false);
  }
  buildSignal() {
    const group = new THREE.Group(), materials = [];
    const glow = opacity => {
      const material = basicMaterial(COL.hazard, { transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide });
      materials.push(material);
      return material;
    };
    const radius = this.r * WORLD_UNIT;
    const disc = new THREE.Mesh(new THREE.CircleGeometry(radius, 48), glow(0.16));
    disc.rotation.x = -Math.PI / 2;
    const ring = new THREE.Mesh(new THREE.RingGeometry(radius - 0.07, radius, 48), glow(0.7));
    ring.rotation.x = -Math.PI / 2;
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 2.4, 48, 1, true), glow(0.08));
    group.add(at(disc, 0, 0.03, 0), at(ring, 0, 0.04, 0), at(beam, 0, 1.2, 0));

    const icon = at(new THREE.Group(), 0, 1.8, 0), arcAngle = Math.PI * 0.56;
    for (let i = 1; i <= 3; i++) {
      const arc = new THREE.Mesh(new THREE.TorusGeometry(i * 11 * WORLD_UNIT, 0.06, 6, 24, arcAngle), glow(1));
      arc.rotation.z = Math.PI / 2 - arcAngle / 2;
      icon.add(arc);
    }
    icon.add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), glow(1)));
    group.add(icon);
    this.scene.add(group);
    return { group, icon, materials };
  }
  randomSpot() {
    return { x: randInt(this.r + 20, W - this.r - 20), y: randInt(100 + this.r, H - 36 - this.r) };
  }
  step(dt) {
    const mv = 340 * dt;
    if (isDown('ArrowLeft')) this.tgt.x -= mv;
    if (isDown('ArrowRight')) this.tgt.x += mv;
    if (isDown('ArrowUp')) this.tgt.y -= mv;
    if (isDown('ArrowDown')) this.tgt.y += mv;
    this.tgt.x = clamp(this.tgt.x, 30, W - 30);
    this.tgt.y = clamp(this.tgt.y, 100, H - 40);
    const f = Math.min(1, dt * 12);
    this.lap.x += (this.tgt.x - this.lap.x) * f;
    this.lap.y += (this.tgt.y - this.lap.y) * f;

    const s = this.sig;
    this.retarget -= dt;
    if (this.retarget <= 0) {
      const a = Math.random() * Math.PI * 2, sp = (100 + Math.random() * 75) * this.spd;
      s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
      this.retarget = 0.45 + Math.random() * 0.6;
    }
    s.x += s.vx * dt; s.y += s.vy * dt;
    const minX = this.r + 10, maxX = W - this.r - 10, minY = 96 + this.r, maxY = H - 34 - this.r;
    if (s.x < minX || s.x > maxX) { s.vx *= -1; s.x = clamp(s.x, minX, maxX); }
    if (s.y < minY || s.y > maxY) { s.vy *= -1; s.y = clamp(s.y, minY, maxY); }

    // eduroam dropout: signal vanishes and reappears somewhere else
    this.blink -= dt;
    if (this.blink <= 0 && s.on) {
      this.blink = 1.9 + Math.random();
      s.on = false;
      this.after(320 / this.spd, () => { Object.assign(s, this.randomSpot()); s.on = true; });
    }

    const inside = s.on && distance(s.x, s.y, this.lap.x, this.lap.y) < this.r;
    if (inside) this.prog += dt / this.need;
    this.up.style.transform = `scaleX(${Math.min(1, this.prog)})`;
    this.status.setText(inside ? 'verbunden' : (s.on ? 'Verbindung getrennt' : 'eduroam sucht …'));
    this.status.setColor(inside ? '#3FD07A' : '#E2382B');
    this.drawAll(inside);

    if (this.prog >= 1) this.win('Abgabe hochgeladen. Um 23:59.');
  }
  drawAll(inside) {
    const s = this.sig, signal = this.signal;
    signal.group.visible = s.on;
    signal.group.position.set(floorX(s.x), 0, floorZ(s.y));
    const color = inside ? COL.good : COL.hazard;
    signal.materials.forEach(material => material.color.setHex(color));
    this.laptop.screenMaterial.color.setHex(inside ? COL.good : 0x6B7A82);
  }
  animate() {
    const time = this.clock / 1000;
    this.signal.icon.position.y = 1.8 + Math.sin(time * 4) * 0.12;
    this.signal.icon.quaternion.copy(this.camera.quaternion);
    this.laptop.group.position.set(floorX(this.lap.x), 0.75 + Math.sin(time * 3) * 0.05, floorZ(this.lap.y));
  }
  onLose() {   // upload aborts, error message pops up
    this.loseDelay = 1300;
    this.up.style.background = css(COL.alarm);
    this.status.setText('Netzwerkfehler').setColor('#E2382B');
    const upload = { fraction: Math.min(1, this.prog) };
    this.tween(upload, { fraction: 0 }, { duration: 600, ease: Ease.quadIn, onUpdate: () => { this.up.style.transform = `scaleX(${upload.fraction})`; } });
    const error = this.body(0, 0, 'ERR_TIMED_OUT', 0, PAPER_S, {
      fontPx: 20, background: css(COL.alarm), padding: '5px 14px', border: `3px solid ${css(COL.ink)}`
    });
    error.scale = 0;
    this.anchor(error, this.laptop.group, new THREE.Vector3(0, 1.5, 0));
    this.tween(error, { scale: 1 }, { duration: 240, ease: Ease.backOut });
  }
}
